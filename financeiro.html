  const pontos = cres.map((c, i) => {
    const x = (i / (cres.length-1)) * 600;
    const y = 100 - (c.total / maxCres) * 80;
    return `${x},${y}`;
  }).join(' L');
  const crescHtml = cres.length > 0 ? `
    <div class="rec-section">
      <div class="rec-section-title">
        <span>📈 Crescimento de gastos · últimos 12 meses</span>
        <span style="color:${crescPct > 0 ? 'var(--amber)' : 'var(--green)'};font-weight:600">${crescPct > 0 ? '+' : ''}${crescPct.toFixed(0)}% no período</span>
      </div>
      <div class="rec-chart-wrap">
        <svg viewBox="0 0 600 100" style="width:100%;height:80px">
          <defs><linearGradient id="rec-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
          </linearGradient></defs>
          <path d="M${pontos} L600,100 L0,100 Z" fill="url(#rec-grad)"/>
          <path d="M${pontos}" fill="none" stroke="#3b82f6" stroke-width="2"/>
          ${cres.map((c, i) => {
            const x = (i / (cres.length-1)) * 600;
            const y = 100 - (c.total / maxCres) * 80;
            return `<circle cx="${x}" cy="${y}" r="${i === cres.length-1 ? 3 : 1.5}" fill="#3b82f6"/>`;
          }).join('')}
        </svg>
        <div class="rec-chart-axis">
          <span>${fmtMes(cres[0]?.mes)} · ${fmtMoney(cres[0]?.total)}</span>
          ${cres.length > 6 ? `<span>${fmtMes(cres[Math.floor(cres.length/2)]?.mes)} · ${fmtMoney(cres[Math.floor(cres.length/2)]?.total)}</span>` : ''}
          <span>${fmtMes(cres[cres.length-1]?.mes)} · ${fmtMoney(cres[cres.length-1]?.total)}</span>
        </div>
      </div>
    </div>
  ` : '';

  // ─── FILTROS + TABELA ───
  const aumentaramQtd = assinaturas.filter(a => a.ativa && a.aumentoPct > 0).length;
  const redundantesSet = new Set();
  alertas.forEach(a => a.ferramentas.forEach(f => redundantesSet.add(f.toLowerCase())));
  const contasQtd = assinaturas.filter(a => a.ativa && a.isConta).length;
  const vendoresQtd = assinaturas.filter(a => a.ativa && !a.isConta).length;

  const filtrosHtml = `
    <div class="rec-filtros">
      <button class="rec-fbtn ${_recFiltro==='todas'?'active':''}" onclick="filtrarRec('todas')">Todas (${assinaturas.filter(a=>a.ativa).length})</button>
      <button class="rec-fbtn ${_recFiltro==='mensais'?'active':''}" onclick="filtrarRec('mensais')">Mensais (${r.qtdMensais})</button>
      <button class="rec-fbtn ${_recFiltro==='anuais'?'active':''}" onclick="filtrarRec('anuais')">Anuais (${r.qtdAnuais})</button>
      ${vendoresQtd > 0 ? `<button class="rec-fbtn ${_recFiltro==='vendores'?'active':''}" onclick="filtrarRec('vendores')">📛 Vendors (${vendoresQtd})</button>` : ''}
      ${contasQtd > 0 ? `<button class="rec-fbtn ${_recFiltro==='contas'?'active':''}" onclick="filtrarRec('contas')">🏦 Conta/Cartão (${contasQtd})</button>` : ''}
      ${aumentaramQtd > 0 ? `<button class="rec-fbtn warn ${_recFiltro==='aumentou'?'active':''}" onclick="filtrarRec('aumentou')">⚠ Aumentou (${aumentaramQtd})</button>` : ''}
      ${redundantesSet.size > 0 ? `<button class="rec-fbtn green ${_recFiltro==='cortar'?'active':''}" onclick="filtrarRec('cortar')">💰 Cortar (${redundantesSet.size})</button>` : ''}
      <input type="search" class="rec-search" placeholder="Buscar vendor..." value="${escapeHtml(_recBusca)}" oninput="buscaRec(this.value)"/>
    </div>
  `;

  // Filtrar
  let lista = assinaturas.filter(a => a.ativa);
  if(_recFiltro === 'mensais') lista = lista.filter(a => a.frequencia === 'Mensal');
  else if(_recFiltro === 'anuais') lista = lista.filter(a => a.frequencia === 'Anual');
  else if(_recFiltro === 'aumentou') lista = lista.filter(a => a.aumentoPct > 0);
  else if(_recFiltro === 'cortar') lista = lista.filter(a => redundantesSet.has(a.vendor.toLowerCase()));
  else if(_recFiltro === 'contas') lista = lista.filter(a => a.isConta);
  else if(_recFiltro === 'vendores') lista = lista.filter(a => !a.isConta);
  if(_recBusca) lista = lista.filter(a => a.vendor.toLowerCase().includes(_recBusca.toLowerCase()));

  const linhasHtml = lista.length === 0 ? `
    <div class="rec-empty">Nenhuma assinatura encontrada com esses filtros.</div>
  ` : lista.map(a => {
    const ehRedundante = redundantesSet.has(a.vendor.toLowerCase());
    const aumentou = a.aumentoPct > 0;
    const rowCls = ehRedundante ? 'red' : (aumentou ? 'warn' : '');
    const catKey = (a.categoria || 'Outros').toLowerCase().replace(/[^a-z]/g, '');
    // Mapeia categoria pra classe CSS via cor (slugfy: minúsculas, sem acento/espaço)
    const catCls = (a.categoria || 'outros').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]/g, '');

    let sub = `${a.frequencia} · ${a.ocorrencias}x · desde ${fmtMesAbrev(a.primeiraCobranca)}`;
    if(aumentou && a.valorAnterior) {
      sub = `${a.frequencia} · ${a.ocorrencias}x · era ${fmtMoney(a.valorAnterior)} → ${fmtMoney(a.valorAtual)}`;
    }

    let tag = '';
    if(ehRedundante) tag = `<span class="rec-tag red">🚨 redundante</span>`;
    else if(aumentou) tag = `<span class="rec-tag warn">⚠ +${a.aumentoPct.toFixed(0)}%</span>`;

    // Indicador de conta/cartão (não é um vendor real)
    const iconConta = a.isConta ? `<span title="Pagamento via conta/cartão (sem vendor identificado no QBO)" style="margin-right:6px;opacity:.7">🏦</span>` : '';

    // Linha pequena com a conta QBO (Chart of Accounts)
    const contaQboLine = a.contaQbo && a.contaQbo !== '—'
      ? `<div style="font-size:11px;color:#6b7599;margin-top:2px">📊 ${escapeHtml(a.contaQbo)}</div>`
      : '';

    return `
      <div class="rec-row ${rowCls}">
        <div>
          <div class="rec-vendor-name">${iconConta}${escapeHtml(a.vendor)}${tag}</div>
          <div class="rec-vendor-sub">${escapeHtml(sub)}</div>
          ${contaQboLine}
        </div>
        <div><span class="rec-badge ${catCls}">${escapeHtml(a.categoria)}</span></div>
        <div class="rec-val">${fmtMoney(a.valorAtual)}</div>
        <div class="rec-date">${fmtDataBR(a.proximaCobranca)}</div>
        <div class="rec-val">${fmtMoney(a.totalAnual)}</div>
        <div style="text-align:right">
          ${a.qboLink ? `<a href="${a.qboLink}" target="_blank" class="rec-qbo-btn" title="Abrir no QBO">↗</a>` : '—'}
        </div>
      </div>
    `;
  }).join('');

  const tblHtml = `
    <div class="rec-tbl">
      <div class="rec-tbl-head">
        <div>Fornecedor</div><div>Categoria</div><div>Por cobrança</div><div>Próxima</div><div>Ano</div><div></div>
      </div>
      ${linhasHtml}
    </div>
  `;

  cont.innerHTML = kpisHtml + catBarHtml + alertasHtml + crescHtml + filtrosHtml + tblHtml + `
    <div class="info-box" style="margin-top:20px">
      <strong>💡 Como funciona:</strong> Detecta cobranças recorrentes nas suas transações Purchase + Bill do QBO dos últimos 18 meses. Agrupa por fornecedor + valor (±5%) e identifica padrões mensais/trimestrais/anuais. <strong>3+ ocorrências = recorrente.</strong> Categorias vêm direto das contas contábeis do seu QBO (Chart of Accounts).
    </div>
  `;
}

function filtrarRec(filtro){
  _recFiltro = filtro;
  renderRecorrentesHTML();
}
function buscaRec(termo){
  _recBusca = termo || '';
  renderRecorrentesHTML();
}

function fmtMes(yyyymm){
  if(!yyyymm) return '';
  const [y,m] = yyyymm.split('-');
  const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${nomes[parseInt(m)-1]}/${y.slice(2)}`;
}
function fmtMesAbrev(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${nomes[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`;
}
function fmtDataBR(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

carregar();
</script>
