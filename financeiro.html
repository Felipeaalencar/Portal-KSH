<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSH · Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--bg4:#2a2f45;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);--text:#f0f2f8;--text2:#b0b8d0;--text3:#6b7599;--red:#ef4444;--green:#22c55e;--amber:#f59e0b;--amber-bg:rgba(245,158,11,.1);--green-bg:rgba(34,197,94,.1);--red-bg:rgba(231,76,60,.1);--blue:#3b82f6;--blue-bg:rgba(59,130,246,.1);--purple:#a855f7;--purple-bg:rgba(168,85,247,.1)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{font-size:24px}
.brand-name{font-size:15px;font-weight:600;color:var(--text)}
.brand-sub{font-size:11px;color:var(--text3);margin-top:1px}
.btn-voltar{background:transparent;border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:13px;font-weight:500;padding:8px 16px;border-radius:8px;font-family:inherit;transition:all .15s}
.btn-voltar:hover{background:var(--bg3);color:var(--text);border-color:var(--text3)}
.container{flex:1;max-width:1200px;margin:0 auto;padding:32px 24px;width:100%}
.page-hd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.page-sub{font-size:13px;color:var(--text3);margin-top:4px}
.qbo-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:7px 12px;border-radius:8px}
.qbo-status .dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.qbo-status.connected .dot{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.6)}
.connect-card{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:16px;padding:48px 32px;text-align:center;max-width:560px;margin:60px auto}
.connect-icon{font-size:56px;margin-bottom:16px}
.connect-title{font-size:22px;font-weight:700;margin-bottom:10px}
.connect-sub{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:28px}
.btn-connect{background:linear-gradient(135deg,#2ca01c,#1c7a13);color:#fff;border:none;padding:14px 32px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:10px;transition:transform .15s;box-shadow:0 4px 16px rgba(44,160,28,.3)}
.btn-connect:hover{transform:translateY(-1px)}
.connect-foot{margin-top:20px;font-size:11px;color:var(--text3)}

/* === FILTRO DE PERÍODO === */
.filter-bar{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.filter-shortcuts{display:flex;gap:6px;flex-wrap:wrap}
.shortcut-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer;font-family:inherit;transition:all .15s}
.shortcut-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.shortcut-btn.active{background:linear-gradient(135deg,#2ca01c,#1c7a13);color:#fff;border-color:#2ca01c;box-shadow:0 2px 8px rgba(44,160,28,.3)}
.filter-dropdowns{display:flex;gap:8px;align-items:center}
.filter-dropdowns select{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:500;padding:7px 10px;border-radius:7px;font-family:inherit;cursor:pointer;outline:none}
.filter-dropdowns select:hover{border-color:var(--border2)}
.filter-dropdowns select:focus{border-color:var(--blue)}
.custom-range{display:none;gap:8px;align-items:center;flex-basis:100%;padding-top:10px;border-top:1px solid var(--border)}
.custom-range.visible{display:flex}
.custom-range input{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:12px;padding:7px 10px;border-radius:7px;font-family:inherit;outline:none}
.custom-range input:focus{border-color:var(--blue)}
.custom-range label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.btn-apply{background:var(--blue);border:none;color:#fff;font-size:12px;font-weight:600;padding:7px 14px;border-radius:7px;cursor:pointer;font-family:inherit}
.periodo-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:10px;padding-left:2px}

/* === SALDOS === */
.saldos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:24px}
.saldo-card{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.saldo-card.bank::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),#16a34a)}
.saldo-card.credit::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),#d97706)}
.saldo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.saldo-icon{font-size:24px}
.saldo-tipo{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--bg)}
.saldo-card.bank .saldo-tipo{color:var(--green);background:var(--green-bg)}
.saldo-card.credit .saldo-tipo{color:var(--amber);background:var(--amber-bg)}
.saldo-nome{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.saldo-valor{font-size:24px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
.saldo-card.bank .saldo-valor{color:var(--green)}
.saldo-card.credit .saldo-valor.negativo{color:var(--amber)}
.saldo-sub{font-size:10px;color:var(--text3);margin-top:6px}

/* === AVISO DE PENDINGS === */
.aviso-pendings{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(245,158,11,.04));border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.aviso-pendings-icon{font-size:28px;flex-shrink:0;line-height:1}
.aviso-pendings-text{flex:1;font-size:13px;color:var(--text2);line-height:1.5;min-width:240px}
.aviso-pendings-text .titulo{color:var(--amber);font-weight:700;font-size:13px;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.aviso-pendings-text .destaque{color:var(--text);font-weight:600}
.aviso-pendings-link{background:var(--amber);color:#0f1117;font-size:12px;font-weight:700;padding:9px 16px;border-radius:8px;text-decoration:none;white-space:nowrap;transition:transform .15s}
.aviso-pendings-link:hover{transform:translateY(-1px)}
.saldo-card .saldo-sub.warn{color:var(--amber);font-weight:600}

/* === KPIs === */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:8px}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-0.5px}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:6px}
.kpi-loading{color:var(--text3);font-size:14px;font-weight:500}
.kpi.green .kpi-value{color:var(--green)}
.kpi.red .kpi-value{color:var(--red)}
.kpi.blue .kpi-value{color:var(--blue)}
.kpi.amber .kpi-value{color:var(--amber)}

/* === SECTION / CHART === */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.section-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.section-action{color:var(--blue);font-size:11px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;background:none;border:none;font-family:inherit}
.chart-container{position:relative;height:340px;margin-top:8px}
.info-box{background:var(--blue-bg);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--text2);line-height:1.5;margin-top:20px}
.info-box strong{color:var(--blue)}
.error-box{background:var(--red-bg);border:1px solid rgba(231,76,60,.3);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--text);margin-bottom:20px}
.btn-disconnect{background:none;border:1px solid var(--border);color:var(--text3);font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.btn-disconnect:hover{color:var(--red);border-color:rgba(231,76,60,.3)}
.skel{background:linear-gradient(90deg,var(--bg3) 0%,var(--bg4) 50%,var(--bg3) 100%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:6px;height:18px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* === LAYOUT APP (sidebar + main) === */
.app-layout{flex:1;display:flex;min-height:0}
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
.sidebar-section{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;padding:10px 10px 6px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--text2);transition:all .15s;border:1px solid transparent;user-select:none;font-family:inherit;background:none;width:100%;text-align:left}
.sidebar-item:hover{background:var(--bg3);color:var(--text)}
.sidebar-item.active{background:linear-gradient(135deg,rgba(44,160,28,.18),rgba(28,122,19,.08));color:var(--text);border-color:rgba(44,160,28,.35);font-weight:600}
.sidebar-item .ic{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.sidebar-item .bg{background:rgba(245,158,11,.18);color:var(--amber);font-size:9px;padding:2px 6px;border-radius:4px;margin-left:auto;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sidebar-item .bg.purple{background:var(--purple-bg);color:var(--purple)}
.sidebar-spacer{flex:1}
.sidebar-divider{height:1px;background:var(--border);margin:12px 0}
.main-content{flex:1;padding:32px 28px;min-width:0;overflow-x:hidden}
.main-content-inner{max-width:1200px;margin:0 auto}

/* === PLACEHOLDER GENÉRICO === */
.placeholder-page{background:var(--bg2);border:1px dashed var(--border2);border-radius:14px;padding:60px 40px;text-align:center;margin-top:20px}
.placeholder-icon{font-size:48px;margin-bottom:14px}
.placeholder-title{font-size:18px;font-weight:700;margin-bottom:8px}
.placeholder-sub{font-size:13px;color:var(--text3);max-width:480px;margin:0 auto;line-height:1.6}
.placeholder-tag{display:inline-block;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:4px 10px;border-radius:6px;margin-top:14px;font-weight:600}

/* === PROJETOS === */
.projetos-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.proj-kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.proj-kpi-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px}
.proj-kpi-value{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.proj-kpi-value.green{color:var(--green)}
.proj-kpi-value.red{color:var(--red)}
.proj-kpi-value.amber{color:var(--amber)}
.proj-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.proj-filter-pill{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.proj-filter-pill:hover{background:var(--bg4);color:var(--text)}
.proj-filter-pill.active{background:linear-gradient(135deg,#2ca01c,#1c7a13);color:#fff;border-color:#2ca01c}
.proj-search{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:12px;padding:7px 12px;border-radius:6px;font-family:inherit;outline:none;min-width:220px;margin-left:auto}
.proj-search:focus{border-color:var(--blue)}
.proj-table{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.proj-table table{width:100%;border-collapse:collapse;font-size:12px}
.proj-table th{background:var(--bg3);text-align:left;padding:11px 14px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;border-bottom:1px solid var(--border)}
.proj-table th.right{text-align:right}
.proj-table td{padding:13px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.proj-table tr:last-child td{border-bottom:none}
.proj-table tr:hover td{background:var(--bg3)}
.proj-table td.right{text-align:right}
.proj-nome{color:var(--text);font-weight:600;font-size:13px}
.proj-cliente{color:var(--text3);font-size:11px;margin-top:2px}
.proj-bar-wrap{display:flex;flex-direction:column;gap:5px;min-width:170px}
.proj-bar-row{display:flex;align-items:center;gap:8px;font-size:10px}
.proj-bar-row .lbl{color:var(--text3);width:36px;flex-shrink:0;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.proj-bar-row .bar{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.proj-bar-row .bar .fill{height:100%;border-radius:3px;transition:width .4s}
.proj-bar-row .bar .fill.income{background:linear-gradient(90deg,#22c55e,#16a34a)}
.proj-bar-row .bar .fill.cost{background:linear-gradient(90deg,#0ea5e9,#0284c7)}
.proj-bar-row .val{color:var(--text);font-weight:600;font-size:10px;min-width:70px;text-align:right}
.margem-tag{display:inline-block;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:-0.2px}
.margem-tag.green{background:var(--green-bg);color:var(--green)}
.margem-tag.red{background:var(--red-bg);color:var(--red)}
.margem-tag.amber{background:var(--amber-bg);color:var(--amber)}
.margem-tag.gray{background:var(--bg3);color:var(--text3)}
.margem-sub{font-size:10px;color:var(--text3);margin-top:3px}
.proj-row.danger{background:rgba(239,68,68,.04)}
.proj-empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
.proj-loading-row td{padding:30px;text-align:center;color:var(--text3)}

/* === DETALHE DO PROJETO (Sprint 2.7 Etapa 2) === */
.pd-header{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pd-header-left{flex:1;min-width:240px}
.pd-back{background:transparent;border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:12px;padding:6px 12px;border-radius:7px;font-family:inherit;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.pd-back:hover{background:var(--bg3);color:var(--text)}
.pd-title{font-size:26px;font-weight:700;letter-spacing:-0.4px;display:flex;align-items:center;gap:10px}
.pd-status-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px}
.pd-status-pill.ativo{background:rgba(34,197,94,.12);color:var(--green)}
.pd-status-pill.inativo{background:rgba(255,255,255,.06);color:var(--text3)}
.pd-meta{color:var(--text3);font-size:13px;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.pd-meta-item{display:flex;align-items:center;gap:4px}
.pd-qbo-link{background:linear-gradient(135deg,#2ca01c,#1c7a13);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pd-qbo-link:hover{transform:translateY(-1px)}
.pd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.pd-kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px}
.pd-kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:6px}
.pd-kpi-val{font-size:24px;font-weight:700;letter-spacing:-0.5px}
.pd-kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
.pd-kpi.income .pd-kpi-val{color:var(--green)}
.pd-kpi.cost .pd-kpi-val{color:var(--amber)}
.pd-kpi.profit.neg .pd-kpi-val{color:var(--red)}
.pd-kpi.profit.pos .pd-kpi-val{color:var(--green)}
.pd-section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.pd-section-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;user-select:none;transition:background .15s}
.pd-section-head:hover{background:var(--bg3)}
.pd-section-head-left{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.pd-section-icon{font-size:18px}
.pd-section-toggle{font-size:11px;color:var(--text3);transition:transform .2s}
.pd-section.open .pd-section-toggle{transform:rotate(90deg)}
.pd-section-total{font-family:'DM Mono',monospace;font-size:15px;font-weight:700}
.pd-section-total.income{color:var(--green)}
.pd-section-total.cost{color:var(--amber)}
.pd-section-body{display:none;border-top:1px solid var(--border);padding:8px 0}
.pd-section.open .pd-section-body{display:block}
.pd-row{display:flex;justify-content:space-between;align-items:center;padding:9px 18px 9px 38px;font-size:13px;color:var(--text2);transition:background .1s}
.pd-row:hover{background:rgba(255,255,255,.02);color:var(--text)}
.pd-row-name{display:flex;align-items:center;gap:8px}
.pd-row-sub{font-size:10px;color:var(--text3);margin-left:6px}
.pd-row-val{font-family:'DM Mono',monospace;font-weight:600;color:var(--text)}
.pd-section-empty{padding:18px 38px;color:var(--text3);font-size:12px;font-style:italic}
.pd-total-bar{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border2);border-radius:12px;padding:18px 22px;margin-top:18px;display:flex;justify-content:space-between;align-items:center}
.pd-total-bar-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.pd-total-bar-val{font-size:26px;font-weight:700;letter-spacing:-0.5px;font-family:'DM Mono',monospace}
.pd-total-bar-val.neg{color:var(--red)}
.pd-total-bar-val.pos{color:var(--green)}

/* === ANÁLISE INTELIGENTE (Sprint 2.8) === */
.pa-section-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin:30px 0 14px}
.pa-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px}
.pa-card-title{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:14px}
.pa-bench-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.pa-bench-item{}
.pa-bench-label{font-size:10px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.pa-bench-val{font-size:18px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.pa-bench-val.neg{color:var(--red)}
.pa-bench-val.pos{color:var(--green)}
.pa-bench-diff{font-size:11px;margin-top:3px;font-weight:500}
.pa-bench-diff.up{color:var(--green)}
.pa-bench-diff.down{color:var(--red)}
.pa-bench-diff.warn{color:var(--amber)}
.pa-bench-diff.neutral{color:var(--text3)}

.pa-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:760px){.pa-grid-2{grid-template-columns:1fr}}

.pa-donut-wrap{display:flex;align-items:center;gap:18px}
.pa-donut{width:130px;height:130px;flex-shrink:0;position:relative}
.pa-donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.pa-donut-center-val{font-size:15px;font-weight:700;color:var(--text)}
.pa-donut-center-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px}
.pa-donut-legend{flex:1;font-size:11px}
.pa-donut-legend-row{display:flex;justify-content:space-between;padding:4px 0;color:var(--text2)}
.pa-donut-legend-row .swatch{display:inline-flex;align-items:center;gap:7px}
.pa-donut-legend-row .swatch i{width:9px;height:9px;border-radius:2px;display:inline-block}
.pa-donut-legend-row .val{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}

.pa-mix-row{margin-bottom:11px}
.pa-mix-row:last-child{margin-bottom:0}
.pa-mix-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.pa-mix-name{color:var(--text);font-weight:500}
.pa-mix-sub{color:var(--text3);font-size:11px;font-variant-numeric:tabular-nums}
.pa-mix-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pa-mix-bar-fill{height:100%;background:var(--purple);border-radius:3px}

.pa-empty{padding:24px;text-align:center;color:var(--text3);font-size:12px}

/* === IA: Tabs + Insight cards === */
.pa-ai-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.pa-ai-trigger{padding:24px;text-align:center}
.pa-ai-btn{background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s ease,opacity .15s ease}
.pa-ai-btn:hover{transform:translateY(-1px)}
.pa-ai-btn:disabled{opacity:.6;cursor:wait}
.pa-ai-hint{font-size:11px;color:var(--text3);margin-top:10px}

.pa-tabs{display:flex;border-bottom:1px solid var(--border)}
.pa-tab{flex:1;background:transparent;border:none;color:var(--text3);padding:13px 8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;transition:all .15s ease}
.pa-tab:hover{color:var(--text2)}
.pa-tab.active{color:var(--blue);border-bottom-color:var(--blue);background:rgba(59,130,246,.08)}
.pa-tab-content{padding:18px;display:none}
.pa-tab-content.active{display:block}

.pa-insight{padding:14px 16px;border-radius:8px;margin-bottom:10px;border-left:3px solid var(--text3);background:rgba(255,255,255,.02)}
.pa-insight:last-child{margin-bottom:0}
.pa-insight.sev-critico{border-left-color:var(--red);background:rgba(239,68,68,.07)}
.pa-insight.sev-atencao{border-left-color:var(--amber);background:rgba(245,158,11,.06)}
.pa-insight.sev-ok{border-left-color:var(--green);background:rgba(34,197,94,.06)}
.pa-insight.sev-info{border-left-color:var(--blue);background:rgba(59,130,246,.07)}
.pa-insight-title{font-size:12px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.pa-insight.sev-critico .pa-insight-title{color:var(--red)}
.pa-insight.sev-atencao .pa-insight-title{color:var(--amber)}
.pa-insight.sev-ok .pa-insight-title{color:var(--green)}
.pa-insight.sev-info .pa-insight-title{color:var(--blue)}
.pa-insight-diag{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:7px}
.pa-insight-acao{font-size:12px;color:var(--text2);line-height:1.55;padding-top:7px;border-top:1px dashed var(--border)}
.pa-insight-acao strong{color:var(--text)}

.pa-ai-footer{border-top:1px solid var(--border);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.15);flex-wrap:wrap;gap:8px}
.pa-ai-meta{font-size:10px;color:var(--text3)}
.pa-ai-regen{background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.pa-ai-regen:hover{background:var(--bg3);color:var(--text)}

.pa-spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:pa-spin .8s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes pa-spin{to{transform:rotate(360deg)}}

/* === ASSINATURAS === */
.rec-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.rec-kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.rec-kpi.highlight{background:linear-gradient(135deg,rgba(34,197,94,.10),rgba(34,197,94,.03));border-color:rgba(34,197,94,.3)}
.rec-kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;font-weight:600}
.rec-kpi.highlight .rec-kpi-label{color:var(--green)}
.rec-kpi-val{font-size:18px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.rec-kpi.highlight .rec-kpi-val{color:var(--green)}
.rec-kpi-hint{font-size:10px;color:var(--text3);margin-top:3px}
.rec-kpi-hint.up{color:var(--red)}
.rec-kpi-hint.warn{color:var(--amber)}
.rec-kpi-hint.good{color:var(--green)}

.rec-section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.rec-section-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

.rec-cat-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:10px;background:var(--bg3)}
.rec-cat-bar > div{height:100%}
.rec-cat-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--text2)}
.rec-cat-legend span{display:flex;align-items:center;gap:6px}
.rec-cat-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

.rec-alert{border-radius:10px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rec-alert.red{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.3)}
.rec-alert.amber{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.3)}
.rec-alert-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.rec-alert.red .rec-alert-title{color:var(--red)}
.rec-alert.amber .rec-alert-title{color:var(--amber)}
.rec-alert-body{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:6px}
.rec-alert-hint{font-size:11px;color:var(--text3)}
.rec-alert-hint b{color:var(--text2)}

.rec-chart-wrap{padding:6px 0}
.rec-chart-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:5px}

.rec-filtros{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.rec-fbtn{background:transparent;color:var(--text2);border:1px solid var(--border);padding:5px 11px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s ease}
.rec-fbtn:hover{background:var(--bg3)}
.rec-fbtn.active{background:rgba(59,130,246,.15);color:var(--blue);border-color:var(--blue);font-weight:600}
.rec-fbtn.warn{color:var(--amber);border-color:rgba(245,158,11,.4)}
.rec-fbtn.warn.active{background:rgba(245,158,11,.15);font-weight:600}
.rec-fbtn.green{color:var(--green);border-color:rgba(34,197,94,.4)}
.rec-fbtn.green.active{background:rgba(34,197,94,.15);font-weight:600}
.rec-search{flex:1;min-width:120px;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:11px;font-family:inherit}

.rec-tbl{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rec-tbl-head{display:grid;grid-template-columns:2.4fr .9fr .9fr 1.1fr .9fr 70px;padding:10px 14px;background:rgba(0,0,0,.2);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;border-bottom:1px solid var(--border)}
.rec-row{display:grid;grid-template-columns:2.4fr .9fr .9fr 1.1fr .9fr 70px;padding:13px 14px;align-items:center;border-bottom:1px solid var(--border);font-size:12px;transition:background .15s ease}
.rec-row:last-child{border-bottom:none}
.rec-row:hover{background:rgba(255,255,255,.02)}
.rec-row.warn{background:rgba(245,158,11,.04)}
.rec-row.red{background:rgba(239,68,68,.04)}
.rec-vendor-name{font-weight:600;color:var(--text)}
.rec-vendor-sub{font-size:10px;color:var(--text3);margin-top:2px}
.rec-badge{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;display:inline-block}
.rec-badge.software{background:rgba(59,130,246,.15);color:var(--blue)}
.rec-badge.infra{background:rgba(124,58,237,.15);color:var(--purple)}
.rec-badge.marketing{background:rgba(245,158,11,.15);color:var(--amber)}
.rec-badge.seguros{background:rgba(34,197,94,.15);color:var(--green)}
.rec-badge.bancostaxas{background:rgba(148,163,184,.15);color:#94a3b8}
.rec-badge.outros{background:rgba(107,117,153,.15);color:var(--text3)}
.rec-val{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.rec-date{color:var(--text3);font-size:11px;font-variant-numeric:tabular-nums}
.rec-qbo-btn{background:transparent;border:1px solid var(--border);color:var(--text3);padding:3px 7px;border-radius:5px;font-size:10px;cursor:pointer;font-family:inherit}
.rec-qbo-btn:hover{background:var(--bg3);color:var(--text)}
.rec-tag{font-size:10px;margin-left:5px;font-weight:600}
.rec-tag.warn{color:var(--amber)}
.rec-tag.red{color:var(--red)}
.rec-tag.gray{color:var(--text3)}

.rec-empty{padding:48px 24px;text-align:center;color:var(--text3);font-size:13px}

</style>
</head>

<script>
if (!sessionStorage.getItem('ksh_user')) {
  window.location.href = '/';
}

function voltarSeletor(){
  sessionStorage.setItem('ksh_show_selector','1');
  window.location.href = '/';
}

function conectarQBO(){ window.location.href = '/api/quickbooks/connect'; }

function desconectarQBO(){
  alert('Por enquanto, pra desconectar tem que deletar a linha em qbo_tokens no Supabase. Faremos botão dedicado em breve.');
}

function fmtMoney(v){
  if(v==null||isNaN(v)) return '-';
  return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtDate(d){
  if(typeof d==='string') d = new Date(d+'T12:00:00');
  return d.toLocaleDateString('pt-BR');
}

function isoDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// === ESTADO GLOBAL DE PERÍODO ===
const periodo = {
  start: null,
  end: null,
  label: '',
  atalho: null
};

function calcularAtalho(tipo){
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth();

  if(tipo==='mes-atual'){
    const start = new Date(ano, mes, 1);
    return { start: isoDate(start), end: isoDate(hoje), label: 'Mês atual ('+MESES_ABREV[mes]+'/'+ano+')' };
  }
  if(tipo==='mes-passado'){
    const start = new Date(ano, mes-1, 1);
    const end = new Date(ano, mes, 0);
    return { start: isoDate(start), end: isoDate(end), label: 'Mês passado ('+MESES_ABREV[start.getMonth()]+'/'+start.getFullYear()+')' };
  }
  if(tipo==='trimestre'){
    const qStart = Math.floor(mes/3)*3;
    const start = new Date(ano, qStart, 1);
    return { start: isoDate(start), end: isoDate(hoje), label: 'Trimestre atual (Q'+(Math.floor(mes/3)+1)+'/'+ano+')' };
  }
  if(tipo==='ano'){
    const start = new Date(ano, 0, 1);
    return { start: isoDate(start), end: isoDate(hoje), label: 'Ano atual ('+ano+')' };
  }
  return null;
}

function aplicarAtalho(tipo){
  const r = calcularAtalho(tipo);
  if(!r) return;
  periodo.start = r.start;
  periodo.end = r.end;
  periodo.label = r.label;
  periodo.atalho = tipo;
  document.getElementById('custom-range').classList.remove('visible');
  sincronizarDropdowns();
  atualizarBotoesAtalho();
  atualizarLabelPeriodo();
  recarregarTudo();
}

  if(!forceReload && employeesCache && (Date.now() - employeesLoadedAt) < 300000) return employeesCache;
  try{
    const r = await fetch('/api/quickbooks/employees');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    employeesCache = d;
    employeesLoadedAt = Date.now();

}

function extrairValor(plReport, nomeLinha){
  if(!plReport||!plReport.Rows||!plReport.Rows.Row) return null;
  function buscar(rows){
    for(const row of rows){
      if(row.Summary&&row.Summary.ColData){
        const label = (row.Summary.ColData[0]&&row.Summary.ColData[0].value)||'';
        if(label.toLowerCase().includes(nomeLinha.toLowerCase())){
          const v = row.Summary.ColData[row.Summary.ColData.length-1];
          return v ? parseFloat(v.value)||0 : 0;
        }
      }
      if(row.Rows&&row.Rows.Row){
        const r = buscar(row.Rows.Row);
        if(r!=null) return r;
      }
    }
    return null;
  }
  return buscar(plReport.Rows.Row);
}

function extrairSerieMensal(plReport, nomeLinha){
  if(!plReport||!plReport.Rows||!plReport.Rows.Row) return [];
  function buscar(rows){
    for(const row of rows){
      if(row.Summary&&row.Summary.ColData){
        const label = (row.Summary.ColData[0]&&row.Summary.ColData[0].value)||'';
        if(label.toLowerCase().includes(nomeLinha.toLowerCase())){
          const cols = row.Summary.ColData;
          const valores = [];
          for(let i=1;i<cols.length-1;i++){
            valores.push(parseFloat(cols[i].value)||0);
          }
          return valores;
        }
      }
      if(row.Rows&&row.Rows.Row){
        const r = buscar(row.Rows.Row);
        if(r&&r.length) return r;
      }
    }
    return [];
  }
  return buscar(plReport.Rows.Row);
}

function extrairColunasMensal(plReport){
  if(!plReport||!plReport.Columns||!plReport.Columns.Column) return [];
  const cols = plReport.Columns.Column;
  const labels = [];
  for(let i=1;i<cols.length-1;i++){
    labels.push(cols[i].ColTitle || '');
  }
  return labels;
}

async function carregarSaldos(){
  const grid = document.getElementById('saldos-grid');
  if(!grid) return;
  try{
    const qboQuery = "select * from Account where AccountType in ('Bank','Credit Card') and Active = true";
    const r = await fetch('/api/quickbooks/proxy?endpoint=query&query=' + encodeURIComponent(qboQuery) + '&minorversion=70');
    const data = await r.json();
    if(data.error){
      grid.innerHTML = '<div class="saldo-card" style="grid-column:1/-1"><div style="color:var(--red);font-size:13px">Erro ao carregar saldos: '+JSON.stringify(data.error)+'</div></div>';
      return;
    }
    const accountsRaw = (data.QueryResponse && data.QueryResponse.Account) || [];

    // Filtra contas com movimentação nos últimos 180 dias (descarta históricas/inativas)
    const CORTE_DIAS = 180;
    const dataCorte = new Date();
    dataCorte.setDate(dataCorte.getDate() - CORTE_DIAS);
    const accounts = accountsRaw.filter(acc => {
      if((acc.Name||'').includes('7013')) return false;
      if(!acc.MetaData || !acc.MetaData.LastUpdatedTime) return false;
      const ult = new Date(acc.MetaData.LastUpdatedTime);
      return ult >= dataCorte;
    });

    if(!accounts.length){
      grid.innerHTML = '<div class="saldo-card" style="grid-column:1/-1"><div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Nenhuma conta com movimentação nos últimos '+CORTE_DIAS+' dias. ('+accountsRaw.length+' contas no plano total, todas paradas)</div></div>';
      return;
    }

    accounts.sort((a,b)=>{
      if(a.AccountType==='Bank' && b.AccountType!=='Bank') return -1;
      if(b.AccountType==='Bank' && a.AccountType!=='Bank') return 1;
      return (a.Name||'').localeCompare(b.Name||'');
    });

    let html = '';
    accounts.forEach(acc=>{
      const isBank = acc.AccountType === 'Bank';
      const tipo = isBank ? 'bank' : 'credit';
      const tipoLabel = isBank ? 'Conta Corrente' : 'Cartão de Crédito';
      const icon = isBank ? '🏦' : '💳';
      const saldo = parseFloat(acc.CurrentBalance) || 0;
      const saldoExibido = isBank ? saldo : -saldo;
      const isNegativo = saldoExibido < 0;
      const ultUpdate = acc.MetaData && acc.MetaData.LastUpdatedTime
        ? new Date(acc.MetaData.LastUpdatedTime).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
        : '-';

      html += `
        <div class="saldo-card ${tipo}">
          <div class="saldo-head">
            <div class="saldo-icon">${icon}</div>
            <div class="saldo-tipo">${tipoLabel}</div>
          </div>
          <div class="saldo-nome">${acc.Name}</div>
          <div class="saldo-valor ${isNegativo?'negativo':''}">${fmtMoney(saldoExibido)}</div>
          <div class="saldo-sub warn">⚠️ Só categorizado · não reflete saldo real do banco</div>
          <div class="saldo-sub">Atualizado: ${ultUpdate}</div>
        </div>
      `;
    });
    grid.innerHTML = html;
  }catch(e){
    grid.innerHTML = '<div class="saldo-card" style="grid-column:1/-1"><div style="color:var(--red);font-size:13px">Erro: '+e.message+'</div></div>';
  }
}

// Tenta contar transações com AccountRef = "Uncategorized Expense" / "Uncategorized Income"
// Não conta o que está em "For Review" do Banking (API não expõe), mas captura
// transações JÁ POSTADAS porém sem categorização adequada.
async function carregarContagemUncategorized(){
  const el = document.getElementById('aviso-pending-count');
  if(!el) return;
  try{
    // 1) Acha contas "Uncategorized" no chart of accounts
    const q1 = "select * from Account where Name like '%Uncategorized%' and Active = true";
    const r1 = await fetch('/api/quickbooks/proxy?endpoint=query&query=' + encodeURIComponent(q1) + '&minorversion=70');
    const d1 = await r1.json();
    const uncatAccounts = (d1.QueryResponse && d1.QueryResponse.Account) || [];
    if(!uncatAccounts.length){ el.textContent = ''; return; }

    // 2) Conta Purchases referenciando essas contas
    let totalCount = 0;
    let totalAmt = 0;
    for(const acc of uncatAccounts){
      const q2 = "select * from Purchase where AccountRef = '" + acc.Id + "' MAXRESULTS 1000";
      const r2 = await fetch('/api/quickbooks/proxy?endpoint=query&query=' + encodeURIComponent(q2) + '&minorversion=70');
      const d2 = await r2.json();
      const purchases = (d2.QueryResponse && d2.QueryResponse.Purchase) || [];
      totalCount += purchases.length;
      for(const p of purchases){ totalAmt += parseFloat(p.TotalAmt) || 0; }
    }

    if(totalCount > 0){
      el.innerHTML = `há <span class="destaque">${totalCount} transações postadas como "Uncategorized" (${fmtMoney(totalAmt)})</span> e provavelmente outras no Banking · `;
    }else{
      el.textContent = '';
    }
  }catch(e){
    console.warn('Não consegui contar uncategorized:', e.message);
    el.textContent = '';
  }
}

async function carregarKPIs(){
  if(!periodo.start || !periodo.end) return;
  ['kpi-receita','kpi-despesas','kpi-lucro','kpi-ar'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.textContent='⏳'; el.classList.add('kpi-loading'); }
  });

  try{
    const url = '/api/quickbooks/proxy?endpoint=' + encodeURIComponent('reports/ProfitAndLoss')
      + '&start_date=' + encodeURIComponent(periodo.start)
      + '&end_date=' + encodeURIComponent(periodo.end)
      + '&minorversion=70';
    const r = await fetch(url);
    const data = await r.json();
    if(data.error){
      ['kpi-receita','kpi-despesas','kpi-lucro'].forEach(id=>{document.getElementById(id).textContent='Erro';});
      console.error('Erro P&L:', data);
      return;
    }
    const report = data.Report || data;
    const receita = extrairValor(report,'Total Income') || extrairValor(report,'Total Revenue') || 0;
    const despesas = extrairValor(report,'Total Expenses') || 0;
    const cogs = extrairValor(report,'Total Cost of Goods Sold') || extrairValor(report,'Total COGS') || 0;
    const lucro = extrairValor(report,'Net Income') || (receita - despesas - cogs);

    document.getElementById('kpi-receita').textContent = fmtMoney(receita);
    document.getElementById('kpi-receita').classList.remove('kpi-loading');
    document.getElementById('kpi-receita-sub').textContent = periodo.label;

async function carregarPL(){
  const cont = document.getElementById('pl-container');
  if(!cont || !periodo.start || !periodo.end) return;
  cont.innerHTML = 'Carregando...';
  try{
    const url = '/api/quickbooks/proxy?endpoint=' + encodeURIComponent('reports/ProfitAndLoss')
      + '&start_date=' + encodeURIComponent(periodo.start)
      + '&end_date=' + encodeURIComponent(periodo.end)
      + '&minorversion=70';
    const r = await fetch(url);
    const data = await r.json();
    if(data.error){ cont.innerHTML = '<div style="color:var(--red)">Erro: '+JSON.stringify(data.error)+'</div>'; return; }
    const report = data.Report || data;

    function renderRow(row, depth=0){
      let html='';
      if(row.Summary&&row.Summary.ColData){
        const label = (row.Summary.ColData[0]&&row.Summary.ColData[0].value) || '';
        const valorRaw = (row.Summary.ColData[row.Summary.ColData.length-1]&&row.Summary.ColData[row.Summary.ColData.length-1].value) || '0';
        const fw = depth===0 ? '700' : '500';
        const color = depth===0 ? 'var(--text)' : 'var(--text2)';
        html += `<div style="display:flex;justify-content:space-between;padding:6px 0;padding-left:${depth*16}px;font-size:13px;font-weight:${fw};color:${color};border-bottom:1px dashed var(--border)"><span>${label}</span><span>${fmtMoney(parseFloat(valorRaw)||0)}</span></div>`;
      }
      if(row.Rows&&row.Rows.Row){
        for(const sub of row.Rows.Row){
          html += renderRow(sub, depth+1);
        }
      }
      return html;
    }

    let html = '';
    if(report.Rows&&report.Rows.Row){
      for(const row of report.Rows.Row){
        html += renderRow(row, 0);
      }
    }
    cont.innerHTML = html || '<div style="color:var(--text3)">Sem dados no período.</div>';
  }catch(e){
    cont.innerHTML = '<div style="color:var(--red)">Erro: '+e.message+'</div>';
  }
}

function renderFluxo(){
  const cont = document.getElementById('conteudo');
  if(!cont) return;
  cont.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px">⏳ Carregando projeção...</div>';

  // Busca dados do QBO: P&L atual + recorrentes + AR
  Promise.all([
    fetch('/api/quickbooks/proxy?endpoint=' + encodeURIComponent('reports/ProfitAndLoss') + '&date_macro=THIS_MONTH&minorversion=70').then(r=>r.json()),
    fetch('/api/quickbooks/proxy?endpoint=' + encodeURIComponent('reports/ProfitAndLoss') + '&date_macro=LAST_MONTH&minorversion=70').then(r=>r.json()),
    fetch('/api/quickbooks/proxy?endpoint=query&query=' + encodeURIComponent("select * from Invoice where Balance > '0'") + '&minorversion=70').then(r=>r.json()),
  ]).then(([plAtual, plAnt, arData]) => {

    // Extrai valores
    const recAtual  = extrairValor(plAtual, 'Total Income') || extrairValor(plAtual, 'Total Revenue') || 0;
    const despAtual = Math.abs((extrairValor(plAtual, 'Total Expenses')||0) + (extrairValor(plAtual, 'Cost of Goods Sold')||0));
    const recAnt    = extrairValor(plAnt, 'Total Income') || extrairValor(plAnt, 'Total Revenue') || 0;
    const despAnt   = Math.abs((extrairValor(plAnt, 'Total Expenses')||0) + (extrairValor(plAnt, 'Cost of Goods Sold')||0));

    // Média últimos 2 meses
    const recMedia  = (recAtual + recAnt) / 2;
    const despMedia = (despAtual + despAnt) / 2;
    const lucroMedia = recMedia - despMedia;

    // AR — a receber
    const faturas = (arData.QueryResponse && arData.QueryResponse.Invoice) || [];
    const totalAR = faturas.reduce((s,f) => s + (parseFloat(f.Balance)||0), 0);

    // Projeção
    const hoje = new Date();
    const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
    const diasPassados = hoje.getDate();
    const diasRestantes = diasNoMes - diasPassados;
    const fracMes = diasPassados / diasNoMes;

    // Estimativa mês atual (extrapolando o que já aconteceu)
    const recProj30   = recAtual / fracMes;
    const despProj30  = despAtual / fracMes;
    const lucroProj30 = recProj30 - despProj30;

    // 60 e 90 dias baseado na média
    const recProj60   = recProj30 + recMedia;
    const despProj60  = despProj30 + despMedia;
    const lucroProj60 = recProj60 - despProj60;

    const recProj90   = recProj30 + recMedia * 2;
    const despProj90  = despProj30 + despMedia * 2;
    const lucroProj90 = recProj90 - despProj90;

    // Caixa atual estimado = AR + lucro acumulado este mês
    const caixaAtual = totalAR + (recAtual - despAtual);

    const caixa30 = caixaAtual + lucroProj30 - (recAtual - despAtual);
    const caixa60 = caixaAtual + lucroProj30 + lucroMedia - (recAtual - despAtual);
    const caixa90 = caixaAtual + lucroProj30 + lucroMedia * 2 - (recAtual - despAtual);

    function semaforo(v) {
      if(v > 5000) return 'var(--green)';
      if(v > 0)    return 'var(--amber)';
      return 'var(--red)';
    }

    function sinal(v) {
      return v >= 0 ? '+' : '';
    }

    // Meses
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const m0 = MESES[hoje.getMonth()];
    const m1 = MESES[(hoje.getMonth()+1)%12];
    const m2 = MESES[(hoje.getMonth()+2)%12];

    cont.innerHTML = `
      <div class="page-hd">
        <div>
          <div class="page-title">Fluxo de Caixa</div>
          <div class="page-sub">Projeção baseada nos dados reais do QBO · atualizada agora</div>
        </div>
      </div>

      <!-- CAIXA ATUAL -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap">
        <div>
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px">Posição atual estimada</div>
          <div style="font-family:'DM Sans',sans-serif;font-size:40px;font-weight:700;color:${semaforo(caixaAtual)}">${fmtMoney(caixaAtual)}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px">A receber: ${fmtMoney(totalAR)} · Lucro acumulado mês: ${fmtMoney(recAtual-despAtual)}</div>
        </div>
        <div style="flex:1;min-width:200px">
          <div style="font-size:12px;color:var(--text3);margin-bottom:8px">Progresso do mês — ${diasPassados} de ${diasNoMes} dias (${Math.round(fracMes*100)}%)</div>
          <div style="background:var(--bg3);border-radius:99px;height:6px;overflow:hidden">
            <div style="background:linear-gradient(90deg,var(--blue),#60a5fa);height:100%;width:${Math.round(fracMes*100)}%;border-radius:99px"></div>
          </div>
        </div>
      </div>

      <!-- PROJEÇÕES 30/60/90 -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px">
        ${[
          {label:'30 dias', mes: m0, rec:recProj30, desp:despProj30, lucro:lucroProj30, caixa:caixa30, nota:'Projeção do mês atual'},
          {label:'60 dias', mes: m1, rec:recProj60, desp:despProj60, lucro:lucroProj60, caixa:caixa60, nota:'Acumulado em 2 meses'},
          {label:'90 dias', mes: m2, rec:recProj90, desp:despProj90, lucro:lucroProj90, caixa:caixa90, nota:'Acumulado em 3 meses'},
        ].map(p => `
          <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;position:relative;overflow:hidden">
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,${semaforo(p.lucro)},transparent)"></div>
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:4px">${p.label} · ${p.mes}</div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:16px">${p.nota}</div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:12px;color:var(--text2)">Receita proj.</span>
                <span style="font-size:14px;font-weight:600;color:var(--green)">${fmtMoney(p.rec)}</span>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:12px;color:var(--text2)">Despesas proj.</span>
                <span style="font-size:14px;font-weight:600;color:var(--red)">${fmtMoney(p.desp)}</span>
              </div>
              <div style="height:1px;background:var(--border)"></div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:12px;color:var(--text2)">Lucro proj.</span>
                <span style="font-size:15px;font-weight:700;color:${semaforo(p.lucro)}">${sinal(p.lucro)}${fmtMoney(p.lucro)}</span>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.03);border-radius:8px;padding:8px 10px;margin-top:4px">
                <span style="font-size:11px;color:var(--text3)">Caixa estimado</span>
                <span style="font-size:14px;font-weight:700;color:${semaforo(p.caixa)}">${fmtMoney(p.caixa)}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- A RECEBER DETALHADO -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px">
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:16px">📋 Faturas em aberto — ${fmtMoney(totalAR)} a receber</div>
        ${faturas.length === 0 
          ? '<div style="font-size:13px;color:var(--text3);text-align:center;padding:20px">Nenhuma fatura em aberto</div>'
          : `<div style="display:flex;flex-direction:column;gap:6px">
            ${faturas.slice(0,8).map(f => {
              const dias = f.DueDate ? Math.ceil((new Date(f.DueDate)-new Date())/(1000*60*60*24)) : null;
              const cor = dias === null ? 'var(--text2)' : dias < 0 ? 'var(--red)' : dias <= 7 ? 'var(--amber)' : 'var(--text2)';
              return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
                <div>
                  <div style="font-size:13px;color:var(--text)">${f.CustomerRef && f.CustomerRef.name ? f.CustomerRef.name : 'Cliente'}</div>
                  <div style="font-size:11px;color:var(--text3)">${f.DueDate ? 'Vence ' + new Date(f.DueDate+'T12:00:00').toLocaleDateString('pt-BR') : 'Sem vencimento'} ${dias !== null ? (dias < 0 ? '· <span style="color:var(--red)">'+Math.abs(dias)+'d atrasada</span>' : '· '+dias+'d') : ''}</div>
                </div>
                <div style="font-size:14px;font-weight:600;color:${cor}">${fmtMoney(parseFloat(f.Balance)||0)}</div>
              </div>`;
            }).join('')}
          </div>`
        }
      </div>

      <!-- ALERTA -->
      ${lucroProj30 < 2000 ? `
      <div style="background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25);border-radius:12px;padding:16px 20px;display:flex;gap:12px;align-items:flex-start">
        <div style="font-size:20px;flex-shrink:0">⚠️</div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--red);margin-bottom:4px">Atenção: margem apertada este mês</div>
          <div style="font-size:12px;color:var(--text2)">A projeção do mês atual indica lucro de ${fmtMoney(lucroProj30)}. Considere acelerar cobranças ou adiar despesas não essenciais.</div>
        </div>
      </div>` : ''}
    `;

  }).catch(e => {
    cont.innerHTML = `<div style="color:var(--red);padding:40px;text-align:center;font-size:13px">Erro ao carregar projeção: ${e.message}</div>`;
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// CARREGAMENTO DE PROJETOS (Sprint 2.7 - Etapa 1)
// 
// Substitui ~400 chamadas QBO por 1 chamada agregada ao endpoint
// /api/quickbooks/projetos-overview que faz no servidor:
//   1) Lista de Customer/Job
//   2) P&L com summarize_column_by=Customers (todos os números num shot)
//   3) TimeActivity 2025+ (todas as horas num shot)
// → resultado pronto em 3-6s, números IDÊNTICOS ao QBO
// ═══════════════════════════════════════════════════════════════════════════

async function carregarProjetos(){
  const tbody = () => document.getElementById('proj-tbody');
  try{
    // Carrega rates dos funcionários (não bloqueante, só pro display da página Config)
    carregarEmployeeRates();

    if(tbody()) tbody().innerHTML = `<tr class="proj-loading-row"><td colspan="6">⏳ Buscando projetos no QuickBooks (1 chamada agregada)...</td></tr>`;

    const t0 = Date.now();
    const r = await fetch('/api/quickbooks/projetos-overview');
    if(!r.ok){
      if(tbody()) tbody().innerHTML = `<tr><td colspan="6" class="proj-empty">⚠️ Erro HTTP ${r.status} ao carregar projetos.</td></tr>`;
      return;
    }
    const data = await r.json();

      if(tbody()) tbody().innerHTML = `<tr><td colspan="6" class="proj-empty">📭 Nenhum projeto com atividade em 2025+ encontrado.</td></tr>`;

      projetosCache = [];
      return;
    }

    projetosCache = data.projetos;
    // Como a busca no arquivo agora é trivial (todos vêm no overview), não precisamos mais do meta separado
    projetosArquivoMeta = new Map();
    projetosArquivoIds = new Set();
    renderProjetosTabela(data.projetos);
  }catch(e){
    console.error('Erro projetos:', e);
    if(tbody()) tbody().innerHTML = `<tr><td colspan="6" class="proj-empty">⚠️ Erro: ${e.message}</td></tr>`;

}

function renderProjetosSummary(dados){
  const el = document.getElementById('projetos-summary');
  if(!el) return;
  const totReceita = dados.reduce((a,d) => a + (d.receita||0), 0);
  const totCusto = dados.reduce((a,d) => a + (d.custo||0), 0);
  const margemMedia = totReceita > 0 ? ((totReceita - totCusto)/totReceita * 100) : 0;
  const ativos = dados.filter(d => d.ativo).length;

  el.innerHTML = `
    <div class="proj-kpi">
      <div class="proj-kpi-label">Total Projetos</div>
      <div class="proj-kpi-value">${dados.length}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">${ativos} ativos</div>
    </div>
    <div class="proj-kpi">
      <div class="proj-kpi-label">Receita Total</div>
      <div class="proj-kpi-value green">${fmtMoney(totReceita)}</div>
    </div>
    <div class="proj-kpi">
      <div class="proj-kpi-label">Custos Totais</div>
      <div class="proj-kpi-value amber">${fmtMoney(totCusto)}</div>
    </div>
    <div class="proj-kpi">
      <div class="proj-kpi-label">Margem Média</div>
      <div class="proj-kpi-value ${margemMedia < 0 ? 'red' : margemMedia < 20 ? 'amber' : 'green'}">${margemMedia.toFixed(1)}%</div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">${fmtMoney(totReceita - totCusto)} lucro</div>
    </div>
  `;
}

function fmtHoras(h){
  if(!h || isNaN(h)) return '—';
  const total = Math.round(h * 60);
  const hh = Math.floor(total / 60);
  const mm = total % 60;
  return hh + ':' + String(mm).padStart(2,'0');
}

function renderProjetosTabela(dados){
  const tbody = document.getElementById('proj-tbody');
  if(!tbody) return;

  let filtroStatus = 'ativos';
  document.querySelectorAll('.proj-filter-pill').forEach(b => {
    if(b.classList.contains('active')) filtroStatus = b.dataset.status;
  });
  const buscaEl = document.getElementById('proj-search');
  const busca = (buscaEl && buscaEl.value) || '';

  let filtrados = dados.slice();
  if(filtroStatus === 'ativos') filtrados = filtrados.filter(d => d.ativo);
  else if(filtroStatus === 'negativos') filtrados = filtrados.filter(d => d.margem !== null && d.margem < 0);
  else if(filtroStatus === 'este-mes'){
    const hoje = new Date();
    const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1).getTime();
    const fim = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0, 23,59,59).getTime();
    filtrados = filtrados.filter(d => {
      if(!d.criado) return false;
      const t = new Date(d.criado).getTime();
      return t >= ini && t <= fim;
    });
  }
  else if(filtroStatus === 'mes-passado'){
    const hoje = new Date();
    const ini = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1).getTime();
    const fim = new Date(hoje.getFullYear(), hoje.getMonth(), 0, 23,59,59).getTime();
    filtrados = filtrados.filter(d => {
      if(!d.criado) return false;
      const t = new Date(d.criado).getTime();
      return t >= ini && t <= fim;
    });
  }

  if(busca.trim()){
    const q = busca.toLowerCase();
    filtrados = filtrados.filter(d =>
      (d.nome||'').toLowerCase().includes(q) ||
      (d.cliente||'').toLowerCase().includes(q)
    );
  }

  // Ordena por data de criação DESC (mais novos primeiro). Sem data vai pro fim.
  filtrados.sort((a,b) => {
    if(!a.criado && !b.criado) return 0;
    if(!a.criado) return 1;
    if(!b.criado) return -1;
    return new Date(b.criado).getTime() - new Date(a.criado).getTime();
  });

  // KPIs reagem ao filtro
  renderProjetosSummary(filtrados);

  if(filtrados.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" class="proj-empty">Nenhum projeto com esses filtros.</td></tr>`;
    return;
  }

  const maxAbs = Math.max(
    ...filtrados.map(d => Math.max(d.receita||0, d.custo||0)),
    1
  );

  let html = '';
  filtrados.forEach(d => {
    const dangerCls = (d.margem !== null && d.margem < 0) ? 'danger' : '';

    let margemCls = 'gray';
    let margemTxt = '—';
    if(d.margem !== null){
      if(d.margem < 0) margemCls = 'red';
      else if(d.margem < 20) margemCls = 'amber';
      else margemCls = 'green';
      margemTxt = (d.margem > 0 ? '+' : '') + d.margem.toFixed(1) + '%';
    }

    const dataInicio = d.criado ? new Date(d.criado).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'}) : '—';

    const wReceita = Math.min(100, (d.receita/maxAbs)*100);
    const wCusto = Math.min(100, (d.custo/maxAbs)*100);

    // Tooltip dos custos: breakdown P&L + Mão de Obra (rate do próprio QBO)
    let breakdownStr = '';
    if(d.breakdown && d.breakdown.length){
      breakdownStr = '\n' + d.breakdown.map(b => `  ${b.name}: ${fmtHoras(b.horas)} × $${b.rate.toFixed(2)}/h = ${fmtMoney(b.total)}${b.fromQbo?'':' (default)'}`).join('\n');
    }
    const tooltipCusto = `P&L (lançamentos): ${fmtMoney(d.custoPL||0)}\n\nMão de obra (${fmtHoras(d.horas||0)}): ${fmtMoney(d.maoObra||0)}${breakdownStr}\n──────\nTotal: ${fmtMoney(d.custo)}`;

    html += `
      <tr class="proj-row ${dangerCls}" style="cursor:pointer" onclick="navegar('projeto/${d.id}')" title="Clique pra ver detalhes do projeto">
        <td><div class="proj-nome">⭐ ${d.nome}</div></td>
        <td><span style="color:var(--text2);font-size:12px">${d.cliente}</span></td>
        <td>
          <div class="proj-bar-wrap">
            <div class="proj-bar-row">
              <span class="lbl">Renda</span>
              <span class="bar"><span class="fill income" style="width:${wReceita}%"></span></span>
              <span class="val">${fmtMoney(d.receita)}</span>
            </div>
            <div class="proj-bar-row" title="${tooltipCusto}">
              <span class="lbl">Custos</span>
              <span class="bar"><span class="fill cost" style="width:${wCusto}%"></span></span>
              <span class="val">${fmtMoney(d.custo)}</span>
            </div>
          </div>
        </td>
        <td class="right">
          <span class="margem-tag ${margemCls}">${margemTxt}</span>
          ${d.margem !== null ? `<div class="margem-sub">${d.lucro >= 0 ? '+' : ''}${fmtMoney(d.lucro)}</div>` : ''}
        </td>
        <td class="right" style="color:var(--text2);font-size:12px;font-variant-numeric:tabular-nums">${fmtHoras(d.horas||0)}</td>
        <td class="right" style="color:var(--text3);font-size:11px">${dataInicio}</td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

function filtrarProjetos(status){
  if(status){
    document.querySelectorAll('.proj-filter-pill').forEach(b => {
      b.classList.toggle('active', b.dataset.status === status);
    });
  }
  if(projetosCache) renderProjetosTabela(projetosCache);
}

// === ANÁLISE INTELIGENTE (Sprint 2.8 Etapa 1) ===
async function carregarAnaliseProjeto(projId){
  const cont = document.getElementById('pa-conteudo');
  if(!cont) return;
  try{
    const r = await fetch('/api/quickbooks/projeto-analise?customer=' + encodeURIComponent(projId));
    if(!r.ok){
      cont.innerHTML = `<div class="pa-empty">⚠️ Não foi possível calcular análises.</div>`;
      return;
    }
    const data = await r.json();
    if(data.benchmark === null){
      cont.innerHTML = `<div class="pa-empty">📊 ${data.mensagem || 'Sem dados pra comparar.'}</div>`;
      return;
    }
    renderAnaliseHTML(data);
  }catch(e){
    console.error('Erro análise:', e);
    cont.innerHTML = `<div class="pa-empty">⚠️ Erro: ${e.message}</div>`;
  }
}

function renderAnaliseHTML(data){
  const cont = document.getElementById('pa-conteudo');
  const b = data.benchmark;
  const c = data.composicao;
  const mix = data.mixEquipe || [];

  // Helper de formatar diff %
  const fmtDiff = (val, isPp) => {
    if(val === null || val === undefined || isNaN(val)) return '';
    const sign = val >= 0 ? '+' : '';
    return isPp ? `${sign}${val.toFixed(1)}pp` : `${sign}${val.toFixed(0)}%`;
  };

  // Helper pra decidir classe de cor (down=ruim, up=bom)
  // Pra receita/margem: up = bom. Pra custo/horas: up = ruim.
  const diffCls = (val, upBom) => {
    if(val === null || val === undefined || Math.abs(val) < 2) return 'neutral';
    const bom = upBom ? val > 0 : val < 0;
    return bom ? 'up' : 'down';
  };

  // ─── BENCHMARK ───
  const benchHtml = `
    <div class="pa-card">
      <div class="pa-card-title">Benchmark vs. seus outros projetos · base: ${b.receita.n} projetos</div>
      <div class="pa-bench-grid">
        <div class="pa-bench-item">
          <div class="pa-bench-label">💰 Receita</div>
          <div class="pa-bench-val">${fmtMoney(b.receita.atual)}</div>
          <div class="pa-bench-diff ${diffCls(b.receita.diffPct, true)}">
            ${fmtDiff(b.receita.diffPct)} vs média (${fmtMoney(b.receita.media)})
          </div>
        </div>
        <div class="pa-bench-item">
          <div class="pa-bench-label">📊 Margem</div>
          <div class="pa-bench-val ${b.margem.atual !== null && b.margem.atual < 0 ? 'neg' : (b.margem.atual !== null && b.margem.atual > 0 ? 'pos' : '')}">
            ${b.margem.atual === null ? '—' : (b.margem.atual >= 0 ? '+' : '') + b.margem.atual.toFixed(1) + '%'}
          </div>
          <div class="pa-bench-diff ${diffCls(b.margem.diffPp, true)}">
            ${fmtDiff(b.margem.diffPp, true)} vs média (${b.margem.media >= 0 ? '+' : ''}${b.margem.media.toFixed(1)}%)
          </div>
        </div>
        <div class="pa-bench-item">
          <div class="pa-bench-label">⏱️ Horas</div>
          <div class="pa-bench-val">${fmtHoras(b.horas.atual)}</div>
          <div class="pa-bench-diff ${diffCls(b.horas.diffPct, false)}">
            ${fmtDiff(b.horas.diffPct)} vs média (${fmtHoras(b.horas.media)})
          </div>
        </div>
        <div class="pa-bench-item">
          <div class="pa-bench-label">💵 $/Hora efetivo</div>
          <div class="pa-bench-val">${b.ratePorHora.atual === null ? '—' : '$' + b.ratePorHora.atual.toFixed(0)}</div>
          <div class="pa-bench-diff ${diffCls(b.ratePorHora.diffPct, true)}">
            ${fmtDiff(b.ratePorHora.diffPct)} vs média ($${b.ratePorHora.media.toFixed(0)}/h)
          </div>
        </div>
      </div>
    </div>
  `;

  // ─── DONUT DE COMPOSIÇÃO ───
  const total = c.total || 1;
  const pCogs = (c.cogs / total) * 100;
  const pExp = (c.expenses / total) * 100;
  const pMao = (c.maoObra / total) * 100;

  // Calcula stroke-dasharray pra cada slice (circunferência = 2*π*15.9 ≈ 100)
  const offset1 = 0;
  const offset2 = -pCogs;
  const offset3 = -(pCogs + pExp);

  const donutHtml = total > 0 ? `
    <div class="pa-card">
      <div class="pa-card-title">Composição do custo</div>
      <div class="pa-donut-wrap">
        <div class="pa-donut">
          <svg viewBox="0 0 42 42" style="width:100%;height:100%">
            <circle cx="21" cy="21" r="15.9" fill="transparent" stroke="var(--bg3)" stroke-width="6"></circle>
            <circle cx="21" cy="21" r="15.9" fill="transparent" stroke="var(--blue)" stroke-width="6"
              stroke-dasharray="${pCogs.toFixed(2)} 100" stroke-dashoffset="${offset1}" transform="rotate(-90 21 21)"></circle>
            <circle cx="21" cy="21" r="15.9" fill="transparent" stroke="var(--amber)" stroke-width="6"

// Cache em memória pra não rebatir IA sem motivo
const _aiCache = new Map();

async function gerarAnaliseIA(projId, forcarRefresh){
  const btn = document.getElementById('pa-ai-btn');
  const card = document.getElementById('pa-ai-card');
  if(!card) return;

  // Cache hit?
  if(!forcarRefresh && _aiCache.has(projId)){
    renderAnaliseIA(card, projId, _aiCache.get(projId));
    return;
  }

  // Loading state
  card.innerHTML = `
    <div class="pa-ai-trigger">
      <button class="pa-ai-btn" disabled>
        <span class="pa-spin"></span>Analisando dados do projeto...
      </button>
      <div class="pa-ai-hint">Isso leva uns 5-10 segundos</div>
    </div>
  `;

  try{
    const r = await fetch('/api/ai/analise-projeto', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ projetoId: projId })
    });
    if(!r.ok){
      let detalheErr = `HTTP ${r.status}`;
      try {
        const txt = await r.text();
        try { 
          const j = JSON.parse(txt);
          detalheErr += ` · ${j.error || txt.substring(0,300)}`;
        } catch(e) {
          detalheErr += ` · ${txt.substring(0,400)}`;
        }
      } catch(e) {}
      console.error('[IA] Erro:', detalheErr);
      card.innerHTML = `
        <div class="pa-ai-trigger">
          <div style="color:var(--red);font-size:12px;margin-bottom:10px;text-align:left;background:rgba(239,68,68,.08);padding:12px;border-radius:6px;word-break:break-word;font-family:monospace;line-height:1.5">${escapeHtml(detalheErr)}</div>
          <button class="pa-ai-btn" onclick="gerarAnaliseIA('${projId}', true)">🔄 Tentar de novo</button>
        </div>
      `;
      return;
    }
    const data = await r.json();
    _aiCache.set(projId, data);
    renderAnaliseIA(card, projId, data);
  }catch(e){
    console.error('Erro IA:', e);
    card.innerHTML = `
      <div class="pa-ai-trigger">
        <div style="color:var(--red);font-size:13px;margin-bottom:10px">⚠️ ${e.message}</div>
        <button class="pa-ai-btn" onclick="gerarAnaliseIA('${projId}', true)">🔄 Tentar de novo</button>
      </div>
    `;
  }
}

function renderAnaliseIA(card, projId, data){
  const cfo = Array.isArray(data.cfo) ? data.cfo : [];
  const ops = Array.isArray(data.operacoes) ? data.operacoes : [];
  const sh = Array.isArray(data.smartHome) ? data.smartHome : [];

  const renderInsights = (arr) => arr.length === 0
    ? `<div class="pa-empty">Sem insights nessa categoria.</div>`
    : arr.map(i => `
      <div class="pa-insight sev-${i.severidade || 'info'}">
        <div class="pa-insight-title">${escapeHtml(i.titulo || '')}</div>
        <div class="pa-insight-diag">${escapeHtml(i.diagnostico || '')}</div>
        ${i.acao ? `<div class="pa-insight-acao"><strong>Ação:</strong> ${escapeHtml(i.acao)}</div>` : ''}
      </div>
    `).join('');

  const meta = data._meta || {};
  const tokens = (meta.inputTokens || 0) + (meta.outputTokens || 0);

  card.innerHTML = `
    <div class="pa-tabs">
      <button class="pa-tab active" data-tab="cfo">💼 CFO <span style="opacity:.6">(${cfo.length})</span></button>
      <button class="pa-tab" data-tab="ops">🔧 Operações <span style="opacity:.6">(${ops.length})</span></button>
      <button class="pa-tab" data-tab="sh">🏠 Smart Home <span style="opacity:.6">(${sh.length})</span></button>
    </div>
    <div class="pa-tab-content active" data-tab-content="cfo">${renderInsights(cfo)}</div>
    <div class="pa-tab-content" data-tab-content="ops">${renderInsights(ops)}</div>
    <div class="pa-tab-content" data-tab-content="sh">${renderInsights(sh)}</div>
    <div class="pa-ai-footer">
      <div class="pa-ai-meta">🤖 ${meta.model || 'Claude'} · ${meta.tempoMs ? (meta.tempoMs/1000).toFixed(1)+'s' : '—'} · ${tokens} tokens</div>
      <button class="pa-ai-regen" onclick="gerarAnaliseIA('${projId}', true)">🔄 Regenerar</button>
    </div>
  `;

  // Liga os clicks das abas
  card.querySelectorAll('.pa-tab').forEach(btn => {
    btn.onclick = () => {
      const tab = btn.dataset.tab;
      card.querySelectorAll('.pa-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      card.querySelectorAll('.pa-tab-content').forEach(c => c.classList.toggle('active', c.dataset.tabContent === tab));
    };
  });
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderConfigEmpTableReadOnly(){
  const wrap = document.getElementById('cfg-emp-table-wrap');
  const statusEl = document.getElementById('cfg-emp-status');

  // Se ainda não rodou Projetos, sugere fazer isso primeiro
  if(!projetosCache || projetosCache.length === 0){
    if(statusEl) statusEl.innerHTML = `<span style="color:var(--amber)">⚠️ Carregue Projetos primeiro pra ver os rates efetivos.</span>`;
    wrap.innerHTML = `
      <div style="padding:50px 30px;text-align:center">
        <div style="font-size:36px;margin-bottom:12px">📁</div>
        <div style="font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.6;max-width:480px;margin-left:auto;margin-right:auto">
          Os rates efetivos vêm das horas lançadas no QBO. Carregue a página <strong>Projetos</strong> primeiro pra calcular o rate atual de cada funcionário.
        </div>
        <button onclick="navegar('projetos')" style="background:var(--blue);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600">Ir pra Projetos →</button>
      </div>
    `;
    return;
  }

  // Agrega TimeActivities de TODOS os projetos no cache pra extrair rate efetivo por funcionário
  const empStats = new Map(); // empId → { name, totalHoras, totalCost, rates: Set, ultimoUso }
  projetosCache.forEach(proj => {
    (proj.breakdown || []).forEach(b => {
      const key = b.empId || '_'+b.name;
      if(empStats.has(key)){
        const s = empStats.get(key);
        s.totalHoras += b.horas;
        s.totalCost += b.total;
        s.rates.add(b.rate);
      }else{
        empStats.set(key, {
          empId: b.empId,
          name: b.name,
          totalHoras: b.horas,
          totalCost: b.total,
          rates: new Set([b.rate]),
          fromQbo: b.fromQbo
        });
      }
    });
  });

  // Combina com lista completa do QBO (inclui funcionários sem horas em 2025+)
  const empsQbo = (employeesCache && employeesCache.employees) || [];
  empsQbo.forEach(emp => {
    if(!empStats.has(emp.qbo_employee_id)){
      empStats.set(emp.qbo_employee_id, {
        empId: emp.qbo_employee_id,
        name: emp.display_name,
        totalHoras: 0,
        totalCost: 0,
        rates: new Set(),
        fromQbo: false
      });
    }
  });

  const linhas = Array.from(empStats.values()).sort((a,b) => b.totalHoras - a.totalHoras);
  const ativos = linhas.filter(l => l.totalHoras > 0);

  if(statusEl){
    statusEl.innerHTML = `<strong style="color:var(--text2)">${ativos.length}</strong> funcionário(s) com horas em 2025+ · <strong style="color:var(--text2)">${linhas.length}</strong> totais · dados de ${projetosCache.length} projetos`;
  }

  if(!linhas.length){
    wrap.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text3);font-size:13px">Nenhum funcionário encontrado.</div>`;
    return;
  }

  let rows = '';
  linhas.forEach(l => {
    const rateMedio = l.totalHoras > 0 ? (l.totalCost / l.totalHoras) : 0;
    const ratesArr = Array.from(l.rates).sort((a,b)=>a-b);
    const variou = ratesArr.length > 1;
    const ratesStr = variou
      ? `$${ratesArr[0].toFixed(2)} – $${ratesArr[ratesArr.length-1].toFixed(2)}`
      : (ratesArr[0] !== undefined ? `$${ratesArr[0].toFixed(2)}` : '—');

    const tag = l.totalHoras === 0
      ? `<span style="background:var(--bg3);color:var(--text3);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px">Sem horas em 2025+</span>`
      : (l.fromQbo
          ? `<span style="background:rgba(34,197,94,.1);color:var(--green);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px">QBO</span>`
          : `<span style="background:rgba(245,158,11,.1);color:var(--amber);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px">Default $${costRatePerHour}</span>`);

    rows += `
      <tr style="border-top:1px solid var(--border)">
        <td style="padding:14px 22px">
          <div style="font-size:13px;font-weight:500">${l.name}</div>
          ${l.empId?`<div style="font-size:10px;color:var(--text3);margin-top:2px">ID ${l.empId}</div>`:''}
        </td>
        <td style="padding:14px 12px">${tag}</td>
        <td style="padding:14px 12px;text-align:right;font-family:'DM Mono',monospace;font-size:13px;color:var(--text)">${l.totalHoras === 0 ? '—' : (rateMedio === ratesArr[0] && !variou ? '$'+rateMedio.toFixed(2) : '$'+rateMedio.toFixed(2)+' méd.')}</td>
        <td style="padding:14px 12px;text-align:right;font-size:12px;color:var(--text3)">${ratesStr}${variou?' <span title="Rate variou ao longo do tempo" style="color:var(--amber);cursor:help">⚡</span>':''}</td>
        <td style="padding:14px 22px;text-align:right;font-size:13px;font-weight:600;color:${l.totalHoras > 0 ? 'var(--text)' : 'var(--text3)'}">${l.totalHoras > 0 ? fmtHoras(l.totalHoras) : '—'}</td>
      </tr>
    `;
  });

  wrap.innerHTML = `
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead>
        <tr style="background:var(--bg3)">
          <th style="padding:11px 22px;text-align:left;color:var(--text3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">Funcionário</th>
          <th style="padding:11px 12px;text-align:left;color:var(--text3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">Fonte</th>
          <th style="padding:11px 12px;text-align:right;color:var(--text3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">Rate efetivo</th>
          <th style="padding:11px 12px;text-align:right;color:var(--text3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">Histórico</th>
          <th style="padding:11px 22px;text-align:right;color:var(--text3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px">Horas 2025+</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}
