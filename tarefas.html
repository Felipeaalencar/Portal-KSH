<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KSH · Tarefas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#161c26;--bg3:#1c2333;--bg4:#232d40;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#dde3ee;--text2:#7a8799;--text3:#4a5568;
  --red:#e74c3c;--red-bg:rgba(231,76,60,0.1);
  --green:#22c55e;--green-bg:rgba(34,197,94,0.1);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,0.1);
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,0.1);
  --purple:#a855f7;--purple-bg:rgba(168,85,247,0.1);
  --r:10px;--rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */







.btn-primary{background:var(--purple-bg);border:1px solid rgba(168,85,247,.3);border-radius:8px;color:var(--purple);font-size:13px;padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-primary:hover{background:rgba(168,85,247,.2)}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}

/* ── FILTROS ── */
.filters{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-btn{background:var(--bg2);border:1px solid var(--border);border-radius:99px;color:var(--text2);font-size:12px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all .15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.active{background:var(--purple-bg);border-color:rgba(168,85,247,.4);color:var(--purple)}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 4px}

/* ── KANBAN ── */
.kanban-wrap{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:start}
@media(max-width:700px){.kanban-wrap{grid-template-columns:1fr}}
.col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:10px;min-width:0}
.col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.col-owner{display:flex;align-items:center;gap:8px}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.col-name{font-size:13px;font-weight:600}
.col-count{font-size:11px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:1px 8px}

/* ── CARDS ── */
.task-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .15s;position:relative}
.task-card:hover{border-color:var(--border2);background:var(--bg4)}
.task-card.overdue{border-color:rgba(231,76,60,.4)}
.task-card.due-soon{border-color:rgba(245,158,11,.35)}
.card-inner{display:flex;gap:8px}
.prio-bar{width:3px;border-radius:0;flex-shrink:0;align-self:stretch}
.prio-high{background:var(--red)}.prio-med{background:var(--amber)}.prio-low{background:var(--green)}
.card-body{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:500;margin-bottom:6px;line-height:1.35}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:4px}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-todo{background:var(--bg4);color:var(--text2)}
.b-doing{background:var(--blue-bg);color:var(--blue)}
.b-done{background:var(--green-bg);color:var(--green)}
.card-date{font-size:10px;color:var(--text3)}
.card-date.overdue{color:var(--red)}
.card-date.due-soon{color:var(--amber)}
.has-note{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--purple);margin-top:5px}
.add-task-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);padding:7px 4px;cursor:pointer;border-radius:8px;margin-top:4px;border:none;background:none;width:100%;font-family:inherit;transition:all .15s}
.add-task-btn:hover{color:var(--text2);background:var(--bg3)}

/* ── OVERLAY / MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);width:100%;max-width:520px;padding:22px}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.modal-title-input{font-size:16px;font-weight:600;color:var(--text);background:none;border:none;outline:none;font-family:inherit;width:100%;line-height:1.3}
.modal-title-input::placeholder{color:var(--text3)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:0;line-height:1;flex-shrink:0;margin-left:8px;margin-top:2px}
.modal-close:hover{color:var(--text)}
.modal-sec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:8px;margin-top:16px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);cursor:pointer;color:var(--text2);background:var(--bg3);transition:all .15s;font-family:inherit}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.sel-as{border-color:#534AB7;background:rgba(83,74,183,.15);color:#a895f7}
.pill.sel-ki{border-color:#0F6E56;background:rgba(15,110,86,.15);color:#22c55e}
.pill.sel-pa{border-color:#854F0B;background:rgba(133,79,11,.15);color:#f59e0b}
.pill.sel-todo{border-color:var(--border2);background:var(--bg4);color:var(--text)}
.pill.sel-doing{border-color:rgba(59,130,246,.4);background:var(--blue-bg);color:var(--blue)}
.pill.sel-done{border-color:rgba(34,197,94,.4);background:var(--green-bg);color:var(--green)}
.pill.sel-high{border-color:rgba(231,76,60,.4);background:var(--red-bg);color:var(--red)}
.pill.sel-med{border-color:rgba(245,158,11,.4);background:var(--amber-bg);color:var(--amber)}
.pill.sel-low{border-color:rgba(34,197,94,.4);background:var(--green-bg);color:var(--green)}
.date-input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 10px;font-family:inherit;width:180px}
.date-input:focus{outline:none;border-color:var(--border2)}
.note-area{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:10px 12px;font-family:inherit;resize:vertical;min-height:90px;line-height:1.5;transition:border .15s}
.note-area:focus{outline:none;border-color:var(--border2)}
.note-area::placeholder{color:var(--text3)}

/* ── HISTÓRICO ── */
.hist-list{margin-top:4px}
.hist-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0;margin-top:1px}
.hist-body{flex:1;min-width:0}
.hist-who{font-size:12px;font-weight:500}
.hist-when{font-size:10px;color:var(--text3);margin-left:6px}
.hist-txt{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.45;word-break:break-word}
.hist-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;margin-top:4px}
.tag-criado{background:var(--bg4);color:var(--text2)}
.tag-nota{background:var(--purple-bg);color:var(--purple)}
.tag-status{background:var(--blue-bg);color:var(--blue)}
.tag-resp{background:var(--amber-bg);color:var(--amber)}
.tag-concluido{background:var(--green-bg);color:var(--green)}

/* ── MODAL FOOTER ── */
.modal-footer{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.btn-save{background:var(--purple-bg);border:1px solid rgba(168,85,247,.3);border-radius:8px;color:var(--purple);font-size:13px;padding:8px 18px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.btn-save:hover{background:rgba(168,85,247,.2)}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:13px;padding:8px 14px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-cancel:hover{border-color:var(--border2);color:var(--text)}
.btn-pdf{background:var(--green-bg);border:1px solid rgba(34,197,94,.3);border-radius:8px;color:var(--green);font-size:13px;padding:8px 14px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-pdf:hover{background:rgba(34,197,94,.2)}
.btn-delete{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:inherit}
.btn-delete:hover{color:var(--red)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 18px;font-size:13px;color:var(--text);z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.toast.err{border-color:rgba(231,76,60,.4);color:var(--red)}
.toast.ok{border-color:rgba(34,197,94,.4);color:var(--green)}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px}

/* ── BANNER ALERTAS ── */
.alerts-banner{padding:10px 20px;border-bottom:1px solid var(--border);display:none}
.alerts-banner.on{display:block}
.alerts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.alert-card{border-radius:var(--r);padding:9px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:opacity .15s}
.alert-card:hover{opacity:.85}
.ac-red{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.25)}
.ac-amber{background:var(--amber-bg);border:1px solid rgba(245,158,11,.25)}
.ac-green{background:var(--green-bg);border:1px solid rgba(34,197,94,.25)}
.ac-icon{font-size:18px;flex-shrink:0}
.ac-title{font-size:12px;font-weight:600}
.ac-red .ac-title{color:#f87171}
.ac-amber .ac-title{color:var(--amber)}
.ac-green .ac-title{color:var(--green)}
.ac-sub{font-size:11px;margin-top:1px}
.ac-red .ac-sub{color:rgba(248,113,113,.8)}
.ac-amber .ac-sub{color:rgba(245,158,11,.8)}
.ac-green .ac-sub{color:rgba(34,197,94,.8)}

/* ── RECORRÊNCIA ── */
.recur-pill{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:99px;background:var(--purple-bg);color:var(--purple);border:1px solid rgba(168,85,247,.25);margin-top:4px}
.ksh-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100}
.ksh-header-left{display:flex;align-items:center;gap:10px}
.ksh-back{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:12px;padding:5px 10px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:5px}
.ksh-back:hover{background:var(--bg3);color:var(--text)}
.ksh-logo{width:34px;height:34px;border-radius:8px;overflow:hidden;background:#111;flex-shrink:0}
.ksh-logo img{width:34px;height:34px;object-fit:contain}
.ksh-module-name{font-size:14px;font-weight:600;color:var(--text)}
.ksh-module-sub{font-size:11px;color:var(--text3);margin-top:1px}
.ksh-header-right{display:flex;align-items:center;gap:10px}
.ksh-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}

.user-mgmt-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:12px;padding:5px 10px;cursor:pointer;font-family:inherit;transition:all .15s}
.user-mgmt-btn:hover{background:var(--bg3);color:var(--text)}
.ov-users{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center}
.ov-users.on{display:flex}
.modal-users{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;width:380px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column}
.modal-users h3{font-size:15px;font-weight:600;margin-bottom:4px}
.modal-users-sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.user-list-modal{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.user-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;transition:border .15s}
.user-row:hover{border-color:var(--border2)}
.user-row-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.user-row-info{flex:1;min-width:0}
.user-row-nome{font-size:13px;font-weight:500;color:var(--text)}
.user-row-func{font-size:11px;color:var(--text3)}
.user-toggle{width:36px;height:20px;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.user-toggle.on{background:var(--green)}
.user-toggle.off{background:var(--bg4,#2a2a2a);border:1px solid var(--border)}
.user-toggle::after{content:'';position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.user-toggle.on::after{left:18px}
.user-toggle.off::after{left:2px}
.modal-users-footer{display:flex;justify-content:flex-end}
.btn-fechar-users{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:13px;padding:7px 16px;cursor:pointer;font-family:inherit}
</style>
</head>

<script>
const SB_URL='https://ayhijjbvvsioxpdsrouq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5aGlqamJ2dnNpb3hwZHNyb3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NzU2NzcsImV4cCI6MjA5MDE1MTY3N30.SymZWfUnyPMIt0gWOunQ9OrtKIMA0FG7s0TmODRiypY';
const SBH={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

async function sbGet(path){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:SBH});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbPost(path,body){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method:'POST',headers:{...SBH,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbPatch(path,body){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method:'PATCH',headers:{...SBH,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbDelete(path){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method:'DELETE',headers:SBH});
  if(!r.ok)throw new Error(await r.text());
}

// ── ESTADO ──────────────────────────────────────────
let currentUser=null;
let tarefas=[];
let usuarios=[];
let filtroStatus='todos';
let filtroResp=null;
let editId=null;
let respSel=null,statusSel=null,prioSel=null,recurSel='unica';

// Cores para avatares — atribuídas dinamicamente por índice
const AV_COLORS=[
  'background:rgba(83,74,183,.2);color:#a895f7',
  'background:rgba(34,197,94,.15);color:#22c55e',
  'background:rgba(245,158,11,.15);color:#f59e0b',
  'background:rgba(231,76,60,.15);color:#e74c3c',
  'background:rgba(59,130,246,.15);color:#60a5fa',
  'background:rgba(168,85,247,.2);color:#a855f7',
  'background:rgba(20,184,166,.15);color:#2dd4bf',
];
let AV_STYLES={};
let AV_INI={};
let RESP_PILL_CLS={};

const STATUS_LABEL={'todo':'A fazer','doing':'Em andamento','done':'Concluída'};
const STATUS_CLS={'todo':'b-todo','doing':'b-doing','done':'b-done'};
const PRIO_LABEL={'high':'Alta','med':'Média','low':'Baixa'};

// ── SESSION ─────────────────────────────────────────
window.addEventListener('load',function(){
  const raw=sessionStorage.getItem('ksh_user');
  if(!raw){window.location.href='index.html';return;}
  try{
    const u=JSON.parse(raw);
    currentUser={
      id:u.id,
      nome:u.nome||u.name||'',
      ini:u.ini||(u.nome||'').substring(0,2).toUpperCase(),
      funcao:u.funcao||'',
      av_style:u.av_style||'background:rgba(168,85,247,.2);color:#a855f7'
    };
    const _av=document.getElementById('header-av')||document.getElementById('ksh-av'); if(_av){_av.textContent=currentUser.ini;}
    if(_av){_av.style.cssText=currentUser.av_style;}
    // header-name removido (header unificado)
    carregarTarefas();
  }catch(e){window.location.href='index.html';}
});

function voltarInicio(){
  sessionStorage.setItem('ksh_show_selector','1');
  window.location.href='index.html';
}

// ── SUPABASE ─────────────────────────────────────────
async function carregarTarefas(){
  // Busca usuários ativos do Supabase primeiro
  try{
    const us=await sbGet('usuarios?ativo=eq.true&order=funcao');
    if(us&&us.length>0){
      usuarios=us;
    } else {
      // fallback: usuários padrão
      usuarios=[
        {id:'u1',nome:'Felippe K',funcao:'Gestor'},
        {id:'u2',nome:'Patricia',funcao:'Gestor'},
        {id:'u3',nome:'Felipe A',funcao:'Gestor'},
        {id:'u4',nome:'Jesse',funcao:'Tecnico'},
        {id:'u5',nome:'Yuri',funcao:'Tecnico'},
      ];
    }
  }catch(e){
    usuarios=[
      {id:'u1',nome:'Felippe K',funcao:'Gestor'},
      {id:'u2',nome:'Patricia',funcao:'Gestor'},
      {id:'u3',nome:'Felipe A',funcao:'Gestor'},
    ];
  }

  // Monta mapas de estilo por usuário
  usuarios.forEach((u,i)=>{
    const key=u.nome;
    AV_STYLES[key]=AV_COLORS[i%AV_COLORS.length];
    AV_INI[key]=(u.ini||(u.nome||'').substring(0,2).toUpperCase()).toUpperCase();
    RESP_PILL_CLS[key]='sel-resp-'+i;
  });

  // Atualiza filtros de responsável dinamicamente
  renderFiltrosResp();
  // Atualiza pills do modal
  renderPillsResp();

  try{
    const data=await sbGet('tarefas?order=criado_em.desc');
    tarefas=data||[];
    renderBoard();
  }catch(e){
    tarefas=JSON.parse(localStorage.getItem('ksh_tarefas')||'[]');
    renderBoard();
    if(e.message.includes('does not exist')||e.message.includes('42P01')){
      showToast('Tabela tarefas não encontrada — usando modo local',2);
    }
  }
}

function renderFiltrosResp(){
  // Remove filtros antigos fixos e gera dinamicamente
  const filters=document.getElementById('filters-resp');
  if(!filters)return;
  filters.innerHTML=usuarios.map(u=>
    `<button class="filter-btn" onclick="setFiltroResp('${escHtml(u.nome)}',this)">${escHtml(u.nome)}</button>`
  ).join('');
}

function renderPillsResp(){
  const pills=document.getElementById('pills-resp');
  if(!pills)return;
  pills.innerHTML=usuarios.map((u,i)=>
    `<button class="pill" data-resp="${escHtml(u.nome)}" onclick="selecionarResp(this)">
      <div class="av" style="width:18px;height:18px;font-size:8px;${AV_STYLES[u.nome]||AV_COLORS[0]}">${AV_INI[u.nome]||'??'}</div>${escHtml(u.nome)}
    </button>`
  ).join('');
}

function salvarLocal(){
  localStorage.setItem('ksh_tarefas',JSON.stringify(tarefas));
}

// ── FILTROS ──────────────────────────────────────────
function setFiltro(f,btn){
  filtroStatus=f;
  document.querySelectorAll('.filters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBoard();
}
function setFiltroResp(r,btn){
  if(filtroResp===r){filtroResp=null;btn.classList.remove('active');}
  else{
    filtroResp=r;
    document.querySelectorAll('#filters-resp .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  renderBoard();
}

// ── RENDER BOARD ─────────────────────────────────────
function renderBoard(){
  const today=new Date(); today.setHours(0,0,0,0);
  const wrap=document.getElementById('kanban-wrap');
  const doneWrap=document.getElementById('done-wrap');
  renderBanner();

  // Ativas no board (excluindo concluídas)
  const ativas=tarefas.filter(t=>t.status!=='done');
  const concluidas=tarefas.filter(t=>t.status==='done');

  // Ajusta o número de colunas dinamicamente
  const nCols = usuarios.length;
  wrap.style.gridTemplateColumns = `repeat(${nCols}, minmax(0, 1fr))`;
  wrap.innerHTML=usuarios.map(u=>{
    let cards=ativas.filter(t=>t.responsavel===u.nome);
    if(filtroStatus!=='todos'&&filtroStatus!=='done') cards=cards.filter(t=>t.status===filtroStatus);
    if(filtroResp&&filtroResp!==u.nome) cards=[];
    const avStyle=AV_STYLES[u.nome]||AV_COLORS[0];
    const ini=AV_INI[u.nome]||'??';
    return `<div class="col">
      <div class="col-header">
        <div class="col-owner">
          <div class="av" style="${avStyle}">${ini}</div>
          <span class="col-name">${escHtml(u.nome)}</span>
        </div>
        <span class="col-count">${cards.length}</span>
      </div>
      ${cards.map(t=>cardHTML(t,today)).join('')}
      <button class="add-task-btn" onclick="abrirModalNova('${escHtml(u.nome)}')">+ Adicionar tarefa</button>
    </div>`;
  }).join('');

  // Concluídas embaixo
  if(!doneWrap)return;
  if(concluidas.length===0){
    doneWrap.style.display='none';
    return;
  }
  doneWrap.style.display='block';

  let listaFiltrada=concluidas;
  if(filtroResp) listaFiltrada=concluidas.filter(t=>t.responsavel===filtroResp);

  doneWrap.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin:28px 0 14px">
      <div style="flex:1;height:0.5px;background:var(--border)"></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)">
        ✅ Concluídas
        <span style="background:var(--green-bg);color:var(--green);border-radius:99px;padding:1px 8px;font-size:10px">${listaFiltrada.length}</span>
      </div>
      <div style="flex:1;height:0.5px;background:var(--border)"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${listaFiltrada.map(t=>{
        const avStyle=AV_STYLES[t.responsavel]||AV_COLORS[0];
        const ini=AV_INI[t.responsavel]||(t.responsavel||'').substring(0,2).toUpperCase();
        const data=t.atualizado_em?new Date(t.atualizado_em).toLocaleDateString('pt-BR'):'';
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer" onclick="abrirModal('${t.id}')">
          <div style="width:18px;height:18px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0">✓</div>
          <div class="av" style="width:20px;height:20px;font-size:8px;flex-shrink:0;${avStyle}">${ini}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:500;color:var(--text2);text-decoration:line-through;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(t.titulo)}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:2px">${escHtml(t.responsavel||'')} · ${data}</div>
          </div>
          <div style="font-size:11px;color:var(--green);border:1px solid rgba(34,197,94,.3);border-radius:99px;padding:2px 8px;background:var(--green-bg);white-space:nowrap;flex-shrink:0" onclick="event.stopPropagation();gerarPDF('${t.id}')">📄 PDF</div>
        </div>`;
      }).join('')}
    </div>`;
}

function cardHTML(t,today){
  const prazo=t.prazo?new Date(t.prazo+'T12:00:00'):null;
  let dateClass='card-date',dateLabel='';
  if(prazo){
    const diff=Math.ceil((prazo-today)/(1000*60*60*24));
    dateLabel=fmtDate(t.prazo);
    if(diff<0){dateClass='card-date overdue';}
    else if(diff<=2){dateClass='card-date due-soon';}
  }
  let cardClass='task-card';
  if(prazo){
    const diff=Math.ceil((prazo-today)/(1000*60*60*24));
    if(diff<0&&t.status!=='done') cardClass+=' overdue';
    else if(diff<=2&&t.status!=='done') cardClass+=' due-soon';
  }
  const temNota=(t.historico||[]).some(h=>h.tipo==='nota');
  const ciclos=t.ciclos||0;
  const recurLabel={'semanal':'Semanal','mensal':'Mensal'}[t.recorrencia]||null;
  return `<div class="${cardClass}" onclick="abrirModal('${t.id}')">
    <div class="card-inner">
      <div class="prio-bar prio-${t.prioridade||'med'}"></div>
      <div class="card-body">
        <div class="card-title">${escHtml(t.titulo)}</div>
        <div class="card-foot">
          <span class="badge ${STATUS_CLS[t.status]||'b-todo'}">${STATUS_LABEL[t.status]||'A fazer'}</span>
          ${dateLabel?`<span class="${dateClass}">${dateLabel}</span>`:''}
        </div>
        ${temNota?`<div class="has-note">💬 ${(t.historico||[]).filter(h=>h.tipo==='nota').length} anotação</div>`:''}
        ${recurLabel?`<div class="recur-pill">🔁 ${recurLabel} · ${ciclos}x</div>`:''}
      </div>
    </div>
  </div>`;
}

// ── MODAL ────────────────────────────────────────────
function abrirModalNova(respPresel){
  editId=null;
  document.getElementById('tf-titulo').value='';
  document.getElementById('tf-nota').value='';
  document.getElementById('tf-prazo').value='';
  document.getElementById('tf-historico').innerHTML='';
  document.getElementById('btn-pdf').style.display='none';
  document.getElementById('btn-delete').style.display='none';
  respSel=respPresel||null;
  statusSel='todo';
  prioSel='med';
  recurSel='unica';
  atualizarPills();
  document.getElementById('ov-tarefa').classList.add('on');
  setTimeout(()=>document.getElementById('tf-titulo').focus(),100);
}

function abrirModal(id){
  const t=tarefas.find(x=>x.id===id);
  if(!t)return;
  editId=id;
  document.getElementById('tf-titulo').value=t.titulo||'';
  document.getElementById('tf-nota').value='';
  document.getElementById('tf-prazo').value=t.prazo||'';
  respSel=t.responsavel||null;
  statusSel=t.status||'todo';
  prioSel=t.prioridade||'med';
  recurSel=t.recorrencia||'unica';
  atualizarPills();
  document.getElementById('btn-delete').style.display='';
  document.getElementById('btn-pdf').style.display=t.status==='done'?'':'none';
  renderHistorico(t.historico||[]);
  document.getElementById('ov-tarefa').classList.add('on');
}

function fecharModal(){
  document.getElementById('ov-tarefa').classList.remove('on');
  editId=null;
}

document.getElementById('ov-tarefa').addEventListener('click',function(e){
  if(e.target===this) fecharModal();
});

function selecionarResp(btn){
  respSel=btn.dataset.resp;
  atualizarPills();
}
function selecionarStatus(btn){
  statusSel=btn.dataset.status;
  atualizarPills();
  document.getElementById('btn-pdf').style.display=statusSel==='done'&&editId?'':'none';
}
function selecionarPrio(btn){
  prioSel=btn.dataset.prio;
  atualizarPills();
}
function selecionarRecur(btn){
  recurSel=btn.dataset.recur;
  atualizarPills();
}

function atualizarPills(){
  document.querySelectorAll('#pills-resp .pill').forEach(p=>{
    const r=p.dataset.resp;
    p.className='pill'+(respSel===r?' '+RESP_PILL_CLS[r]:'');
  });
  document.querySelectorAll('#pills-status .pill').forEach(p=>{
    const s=p.dataset.status;
    p.className='pill'+(statusSel===s?' sel-'+s:'');
  });
  document.querySelectorAll('#pills-prio .pill').forEach(p=>{
    const pr=p.dataset.prio;
    p.className='pill'+(prioSel===pr?' sel-'+pr:'');
  });
  document.querySelectorAll('#pills-recur .pill').forEach(p=>{
    const r=p.dataset.recur;
    p.className='pill'+(recurSel===r?' sel-doing':'');
  });
}

function renderHistorico(hist){
  if(!hist||hist.length===0){document.getElementById('tf-historico').innerHTML='';return;}
  document.getElementById('tf-historico').innerHTML=
    '<div class="modal-sec" style="margin-top:16px">Histórico</div>'+
    hist.map(h=>`<div class="hist-item">
      <div class="hist-av" style="${AV_STYLES[h.usuario]||'background:var(--bg4);color:var(--text2)'}">${AV_INI[h.usuario]||'??'}</div>
      <div class="hist-body">
        <span class="hist-who">${escHtml(h.usuario)}</span>
        <span class="hist-when">${fmtDatetime(h.ts)}</span>
        ${h.texto?`<div class="hist-txt">"${escHtml(h.texto)}"</div>`:''}
        <span class="hist-tag tag-${h.tipo}">${tagLabel(h.tipo)}</span>
      </div>
    </div>`).join('');
}

function tagLabel(t){
  return{criado:'criação',nota:'anotação',status:'status',responsavel:'responsável',concluido:'conclusão'}[t]||t;
}

// ── SALVAR ───────────────────────────────────────────
async function salvarTarefa(){
  const titulo=document.getElementById('tf-titulo').value.trim();
  if(!titulo){showToast('Informe o título',2);return;}
  if(!respSel){showToast('Selecione um responsável',2);return;}

  const notaTexto=document.getElementById('tf-nota').value.trim();
  const prazo=document.getElementById('tf-prazo').value||null;
  const agora=new Date().toISOString();

  let historico=[];
  if(editId){
    const original=tarefas.find(t=>t.id===editId);
    historico=[...(original.historico||[])];
    if(original.responsavel!==respSel){
      historico.push({tipo:'responsavel',usuario:currentUser.nome,ts:agora,texto:`Transferido para ${respSel}`});
    }
    if(original.status!==statusSel){
      const tipo=statusSel==='done'?'concluido':'status';
      historico.push({tipo,usuario:currentUser.nome,ts:agora,texto:`Status: ${STATUS_LABEL[statusSel]}`});
    }
    if(notaTexto){
      historico.push({tipo:'nota',usuario:currentUser.nome,ts:agora,texto:notaTexto});
    }
  }else{
    historico=[{tipo:'criado',usuario:currentUser.nome,ts:agora,texto:`Criada e atribuída a ${respSel}`}];
    if(notaTexto) historico.push({tipo:'nota',usuario:currentUser.nome,ts:agora,texto:notaTexto});
  }

  // ciclos: incrementa se estava doing/todo e vai para done
  let ciclos=0;
  if(editId){
    const orig=tarefas.find(t=>t.id===editId);
    ciclos=orig.ciclos||0;
    if(orig.status!=='done'&&statusSel==='done') ciclos++;
  }
  const payload={
    titulo,
    responsavel:respSel,
    status:statusSel,
    prioridade:prioSel,
    prazo,
    recorrencia:recurSel,
    ciclos,
    historico,
    atualizado_em:agora
  };

  try{
    if(editId){
      // tenta Supabase
      try{
        await sbPatch('tarefas?id=eq.'+editId,payload);
      }catch(e){
        // fallback local
        const i=tarefas.findIndex(t=>t.id===editId);
        if(i>=0) tarefas[i]={...tarefas[i],...payload};
        salvarLocal();
      }
      const i=tarefas.findIndex(t=>t.id===editId);
      if(i>=0) tarefas[i]={...tarefas[i],...payload};
      showToast('Tarefa atualizada ✓',1);
    }else{
      payload.criado_em=agora;
      payload.criado_por=currentUser.nome;
      payload.recorrencia=recurSel;
      payload.ciclos=0;
      let nova;
      try{
        const res=await sbPost('tarefas',payload);
        nova=res[0]||payload;
      }catch(e){
        nova={...payload,id:'local_'+Date.now()};
        tarefas.unshift(nova);
        salvarLocal();
        fecharModal();
        renderBoard();
        showToast('Tarefa criada (modo local) ✓',1);
        return;
      }
      tarefas.unshift(nova);
      showToast('Tarefa criada ✓',1);
    }
    fecharModal();
    renderBoard();
  }catch(e){
    showToast('Erro ao salvar: '+e.message,2);
  }
}

// ── EXCLUIR ──────────────────────────────────────────
async function excluirTarefa(){
  if(!editId||!confirm('Excluir esta tarefa?'))return;
  try{
    try{await sbDelete('tarefas?id=eq.'+editId);}catch(e){}
    tarefas=tarefas.filter(t=>t.id!==editId);
    salvarLocal();
    fecharModal();
    renderBoard();
    showToast('Tarefa excluída',1);
  }catch(e){showToast('Erro ao excluir',2);}
}

      <div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Carregando...</div>
    </div>
    <div class="modal-users-footer">
      <button class="btn-fechar-users" onclick="fecharModalUsuarios()">Fechar</button>
    </div>
  </div>
</div>
</body></html>`;

  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='KSH_Tarefa_'+t.titulo.replace(/[^a-zA-Z0-9]/g,'_').substring(0,40)+'_'+new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')+'.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('PDF gerado — abra o arquivo e imprima (Ctrl+P)',1);
}

function tagStyle(tipo){
  return{
    criado:'background:#e8e8e8;color:#555',
    nota:'background:#f0e6ff;color:#7c3aed',
    status:'background:#dbeafe;color:#1d4ed8',
    responsavel:'background:#fef3c7;color:#92400e',
    concluido:'background:#dcfce7;color:#166534'
  }[tipo]||'background:#eee;color:#666';
}

// ── HELPERS ──────────────────────────────────────────
function fmtDate(d){
  if(!d)return '';
  const[y,m,day]=d.split('-');
  return `${day}/${m}/${y}`;
}
function fmtDateBR(iso){
  return new Date(iso).toLocaleDateString('pt-BR');
}
function fmtDatetime(iso){
  if(!iso)return '';
  return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderBanner(){
  const today=new Date(); today.setHours(0,0,0,0);
  const ativas=tarefas.filter(t=>t.status!=='done');
  const vencidas=ativas.filter(t=>{
    if(!t.prazo)return false;
    return new Date(t.prazo+'T12:00:00')<today;
  });
  const amanha=ativas.filter(t=>{
    if(!t.prazo)return false;
    const diff=Math.ceil((new Date(t.prazo+'T12:00:00')-today)/(1000*60*60*24));
    return diff>=0&&diff<=1;
  });
  const hojeConcluidas=tarefas.filter(t=>{
    if(t.status!=='done')return false;
    const at=t.atualizado_em;
    if(!at)return false;
    const d=new Date(at); d.setHours(0,0,0,0);
    return d.getTime()===today.getTime();
  });
  const banner=document.getElementById('alerts-banner');
  const row=document.getElementById('alerts-row');
  if(vencidas.length===0&&amanha.length===0&&hojeConcluidas.length===0){
    banner.classList.remove('on'); return;
  }
  banner.classList.add('on');
  let html='';
  if(vencidas.length>0){
    const nomes=vencidas.map(t=>t.titulo.substring(0,20)).slice(0,2).join(' · ')+(vencidas.length>2?'...':'');
    html+=`<div class="alert-card ac-red" onclick="setFiltro('todo',document.querySelector('.filter-btn'))">
      <span class="ac-icon">⚠️</span>
      <div><div class="ac-title">${vencidas.length} tarefa${vencidas.length>1?'s':''} vencida${vencidas.length>1?'s':''}</div>
      <div class="ac-sub">${escHtml(nomes)}</div></div></div>`;
  }
  if(amanha.length>0){
    const nomes=amanha.map(t=>t.responsavel+': '+t.titulo.substring(0,15)).slice(0,2).join(' · ');
    html+=`<div class="alert-card ac-amber">
      <span class="ac-icon">⏰</span>
      <div><div class="ac-title">${amanha.length} vence${amanha.length>1?'m':''} hoje/amanhã</div>
      <div class="ac-sub">${escHtml(nomes)}</div></div></div>`;
  }
  if(hojeConcluidas.length>0){
    html+=`<div class="alert-card ac-green">
      <span class="ac-icon">✅</span>
      <div><div class="ac-title">${hojeConcluidas.length} concluída${hojeConcluidas.length>1?'s':''} hoje</div>
      <div class="ac-sub">Bom trabalho!</div></div></div>`;
  }
  row.innerHTML=html;
}

function showToast(msg,tipo){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast on'+(tipo===2?' err':tipo===1?' ok':'');
  setTimeout(()=>t.className='toast',3000);
}

// ── GESTÃO DE USUÁRIOS NO KANBAN ─────────────────────────────────
let todosUsuarios = [];
let usuariosAtivos = new Set();

async function abrirModalUsuarios(){
  document.getElementById('ov-users').classList.add('on');
  const el = document.getElementById('user-list-modal');
  el.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Carregando...</div>';
  try {
    const todos = await sbGet('usuarios?order=funcao,nome');
    todosUsuarios = todos || [];
    // Usuários ativos = os que estão no board agora
    usuariosAtivos = new Set(usuarios.map(u => u.id || u.nome));
    renderUserList();
  } catch(e) {
    el.innerHTML = '<div style="color:var(--red);font-size:13px;padding:10px">Erro ao carregar usuários: ' + e.message + '</div>';
  }
}

function fecharModalUsuarios(){
  document.getElementById('ov-users').classList.remove('on');
}

function renderUserList(){
  const el = document.getElementById('user-list-modal');
  if(!todosUsuarios.length){
    el.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Nenhum usuário encontrado no Supabase.</div>';
    return;
  }
  el.innerHTML = todosUsuarios.map((u,i) => {
    const key = u.id || u.nome;
    const ativo = usuariosAtivos.has(key);
    const style = AV_COLORS[i % AV_COLORS.length];
    const ini = (u.ini || (u.nome||'').substring(0,2)).toUpperCase();
    return `<div class="user-row">
      <div class="user-row-av" style="${style}">${escHtml(ini)}</div>
      <div class="user-row-info">
        <div class="user-row-nome">${escHtml(u.nome||'')}</div>
        <div class="user-row-func">${escHtml(u.funcao||'')}</div>
      </div>
      <button class="user-toggle ${ativo?'on':'off'}" onclick="toggleUsuario('${escHtml(key)}',this)" title="${ativo?'Remover do board':'Adicionar ao board'}"></button>
    </div>`;
  }).join('');
}

function toggleUsuario(key, btn){
  if(usuariosAtivos.has(key)){
    usuariosAtivos.delete(key);
    btn.classList.remove('on');
    btn.classList.add('off');
  } else {
    usuariosAtivos.add(key);
    btn.classList.remove('off');
    btn.classList.add('on');
  }
  // Atualiza o array usuarios com os ativos
  usuarios = todosUsuarios.filter(u => usuariosAtivos.has(u.id || u.nome));
  // Remonta mapas de estilo
  AV_STYLES = {};
  AV_INI = {};
  RESP_PILL_CLS = {};
  usuarios.forEach((u,i) => {
    const k = u.nome;
    AV_STYLES[k] = AV_COLORS[i % AV_COLORS.length];
    AV_INI[k] = (u.ini||(u.nome||'').substring(0,2).toUpperCase()).toUpperCase();
    RESP_PILL_CLS[k] = 'sel-resp-'+i;
  });
  renderFiltrosResp();
  renderPillsResp();
  renderBoard();
}

// Fecha ao clicar fora do modal
document.addEventListener('click', function(e){
  const ov = document.getElementById('ov-users');
  if(ov && ov.classList.contains('on') && e.target === ov) fecharModalUsuarios();
});
</script>
